<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آفلاین — Daily Fashion AF</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:#FCFBF9;color:#2B282C;
    min-height:100vh;display:grid;place-items:center;
    text-align:center;padding:2rem;
  }
  .box{
    max-width:420px;
    background:#FFFFFF;
    border:1px solid #F0E6E9;
    border-radius:24px;
    padding:2.5rem 2rem;
    box-shadow:0 4px 12px rgba(212,105,134,.06);
  }
  .icon{
    width:72px;height:72px;
    margin:0 auto 1.5rem;
    border-radius:50%;
    background:#FDF2F5;
    display:grid;place-items:center;
    color:#D46986;
    font-size:2rem;
  }
  h1{color:#D46986;font-size:1.5rem;margin-bottom:.6rem}
  p{color:#7A757B;line-height:1.7;margin-bottom:1.8rem;font-size:.95rem}
  .btn{
    display:inline-flex;
    padding:.9rem 1.8rem;
    background:linear-gradient(135deg,#D46986,#A9425D);
    color:#fff;
    border-radius:999px;
    font-weight:700;
    text-decoration:none;
    transition:transform .3s;
  }
  .btn:hover{transform:translateY(-3px)}
  @media(prefers-color-scheme:dark){
    body{background:#141416;color:#F5F5F5}
    .box{background:#1E1E22;border-color:#2D2B30}
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>اتصال اینترنت قطع است</h1>
    <p>برای دیدن محتواهای جدید، لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.</p>
    <a href="./index.html" class="btn">تلاش مجدد</a>
  </div>
</body>
</html>
