<style>
/* ═══════════ §1 NEW MODERN TOKENS ═══════════ */
:root {
  --primary: #E91E63;
  --primary-dark: #C2185B;
  --primary-light: #FCE4EC;
  --bg: #FFF9FA;
  --surface: #FFFFFF;
  --text-main: #2D2A2E;
  --text-muted: #8E8A93;
  --border: #F2E1E6;
  --shadow-sm: 0 4px 12px rgba(233, 30, 99, 0.05);
  --shadow-lg: 0 20px 40px -10px rgba(233, 30, 99, 0.15);
  --radius: 24px;
  --radius-sm: 14px;
  --header-h: 72px;
  --bottom-nav-h: 70px;
  --container: 1200px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --font-main: 'Vazirmatn', sans-serif;
  --font-display: 'Playfair Display', serif;
}
[data-theme="dark"] {
  --bg: #121212;
  --surface: #1E1E24;
  --text-main: #F5F5F5;
  --text-muted: #A0A0A5;
  --border: #332A2E;
  --primary-light: #3A222A;
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.6);
}

/* ═══════════ §2 RESET ═══════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-main);
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color .4s var(--ease), color .4s var(--ease);
  padding-bottom: var(--bottom-nav-h);
}
@media (min-width: 900px) { body { padding-bottom: 0; } }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
h1, h2, h3, h4 { font-weight: 800; line-height: 1.3; }
[lang="en"] h1, [lang="en"] h2, [lang="en"] h3, [lang="en"] .brand-name { font-family: var(--font-display); }
.container { width: min(100% - 2rem, var(--container)); margin-inline: auto; }
.ico { display: inline-flex; align-items: center; justify-content: center; }
.ico svg { width: 1.2em; height: 1.2em; }

/* ═══════════ §3 HEADER & NAV ═══════════ */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--header-h);
  background: rgba(255, 249, 250, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: all .3s var(--ease);
}
[data-theme="dark"] .site-header { background: rgba(18, 18, 18, 0.85); }
.nav-wrap { display: flex; align-items: center; justify-content: space-between; height: 100%; }

.brand { display: flex; align-items: center; gap: 0.75rem; }
.logo-holder {
  width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid var(--surface);
  box-shadow: var(--shadow-sm); transition: transform .4s var(--ease);
}
.brand:hover .logo-holder { transform: scale(1.05) rotate(5deg); }
.logo-holder img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; }
.brand-name em { font-style: normal; color: var(--primary); }

/* Desktop Nav */
.desktop-nav { display: none; gap: 0.5rem; background: var(--surface); padding: 0.35rem; border-radius: 999px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
@media (min-width: 900px) { .desktop-nav { display: flex; } }
.desktop-nav a {
  padding: 0.6rem 1.2rem; border-radius: 999px; font-size: 0.9rem; font-weight: 600;
  color: var(--text-muted); transition: all .3s var(--ease);
}
.desktop-nav a:hover, .desktop-nav a.active { background: var(--primary-light); color: var(--primary); }

/* Nav Actions */
.nav-actions { display: flex; align-items: center; gap: 0.5rem; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-main);
  transition: all .3s var(--ease);
}
.icon-btn:hover { background: var(--primary-light); color: var(--primary); transform: translateY(-2px); }
.lang-switch { display: flex; background: var(--surface); border-radius: 999px; padding: 0.25rem; border: 1px solid var(--border); }
.lang-switch button { padding: 0.3rem 0.8rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); transition: all .3s; }
.lang-switch button.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }

/* Mobile Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-h); z-index: 100;
  background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
}
[data-theme="dark"] .bottom-nav { background: rgba(30, 30, 36, 0.9); }
@media (min-width: 900px) { .bottom-nav { display: none; } }
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
  color: var(--text-muted); font-size: 0.7rem; font-weight: 600; transition: all .3s var(--ease);
  flex: 1; height: 100%; position: relative;
}
.bottom-nav a .ico { font-size: 1.4rem; transition: transform .3s var(--ease); }
.bottom-nav a.active { color: var(--primary); }
.bottom-nav a.active .ico { transform: translateY(-3px); }
.bottom-nav a.active::before {
  content: ''; position: absolute; top: 0; width: 30%; height: 3px; background: var(--primary);
  border-radius: 0 0 3px 3px;
}

/* ═══════════ §4 BUTTONS ═══════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.9rem 1.8rem; border-radius: 999px; font-weight: 700; font-size: 0.95rem;
  transition: all .3s var(--ease); border: 1px solid transparent; white-space: nowrap;
}
.btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; box-shadow: 0 10px 20px -10px rgba(233, 30, 99, 0.6); }
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 25px -10px rgba(233, 30, 99, 0.8); }
.btn-outline { background: var(--surface); color: var(--text-main); border-color: var(--border); box-shadow: var(--shadow-sm); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); }
.btn-sm { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
.btn-block { width: 100%; }

/* ═══════════ §5 HERO ═══════════ */
.hero { position: relative; padding-top: calc(var(--header-h) + 3rem); padding-bottom: 4rem; overflow: hidden; }
.hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1920&q=80') center/cover; opacity: 0.08; z-index: -1; }
.hero-content { max-width: 700px; margin-inline: auto; text-align: center; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);
}
.hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 1.2rem; line-height: 1.2; }
.hero p { font-size: clamp(1rem, 2vw, 1.15rem); color: var(--text-muted); margin-bottom: 2rem; max-width: 600px; margin-inline: auto; }
.hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

/* ═══════════ §6 SECTIONS & GRIDS ═══════════ */
.section { padding: 4rem 0; }
.section-header { text-align: center; margin-bottom: 3rem; }
.section-header h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 0.5rem; }
.section-header p { color: var(--text-muted); font-size: 1.05rem; }

/* Video Grid */
.reels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.reel-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow-sm); transition: all .4s var(--ease);
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(20px);
}
.reel-card.visible { opacity: 1; transform: translateY(0); }
.reel-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
.reel-thumb { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.reel-thumb video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: opacity .3s; }
.reel-card:hover .reel-thumb video { opacity: 1; }
.reel-play-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); cursor: pointer;
}
.reel-play-btn {
  width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.9);
  display: grid; place-items: center; color: var(--primary); font-size: 1.2rem;
  transition: transform .3s var(--ease);
}
.reel-card:hover .reel-play-btn { transform: scale(1.1); background: var(--primary); color: #fff; }
.reel-badge {
  position: absolute; top: 1rem; right: 1rem; background: var(--surface); color: var(--primary);
  padding: 0.2rem 0.8rem; border-radius: 999px; font-size: 0.75rem; font-weight: 800;
  box-shadow: var(--shadow-sm);
}
[dir="rtl"] .reel-badge { right: auto; left: 1rem; }
.reel-body { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }
.reel-body h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.reel-body p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.2rem; flex: 1; }
.reel-actions { display: flex; gap: 0.5rem; }

/* Empty State */
.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; background: var(--surface);
  border-radius: var(--radius); border: 1px dashed var(--border);
}
.empty-state h3 { color: var(--text-muted); font-weight: 600; margin-bottom: 0.5rem; }

/* ═══════════ §7 MODAL ═══════════ */
.modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
.modal.open { display: flex; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); }
.modal-box {
  position: relative; background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 500px;
  overflow: hidden; box-shadow: var(--shadow-lg); z-index: 1; animation: modalIn .3s var(--ease);
}
@keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-close { position: absolute; top: 1rem; right: 1rem; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; display: grid; place-items: center; cursor: pointer; }
.modal-video { aspect-ratio: 16/9; background: #000; }
.modal-video video { width: 100%; height: 100%; object-fit: contain; }
.modal-info { padding: 1.5rem; }
.modal-info h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
.modal-info p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }

/* ═══════════ §8 ADMIN PANEL (UPGRADED) ═══════════ */
.admin-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: calc(var(--header-h) + 2rem) 1rem 2rem; }
.admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 500px; box-shadow: var(--shadow-lg); }
.admin-card h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
.form-group { margin-bottom: 1.2rem; }
.form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; }
.form-input {
  width: 100%; padding: 0.9rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg); color: var(--text-main); font-family: inherit; font-size: 1rem;
  transition: border-color .3s;
}
.form-input:focus { outline: none; border-color: var(--primary); }
.admin-status { text-align: center; font-weight: 600; font-size: 0.9rem; margin-top: 1rem; }

/* Tabs */
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: var(--bg); padding: 0.4rem; border-radius: var(--radius-sm); }
.tab-btn { flex: 1; padding: 0.6rem; text-align: center; font-weight: 700; font-size: 0.9rem; border-radius: 8px; color: var(--text-muted); transition: all .3s; }
.tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

/* ═══════════ §9 FOOTER ═══════════ */
.site-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 3rem 0 1.5rem; margin-top: 3rem; }
.footer-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; text-align: center; }
@media (min-width: 768px) { .footer-grid { grid-template-columns: 2fr 1fr 1fr; text-align: left; } }
.footer-brand p { color: var(--text-muted); font-size: 0.9rem; margin-top: 1rem; max-width: 300px; margin-inline: auto; }
@media (min-width: 768px) { .footer-brand p { margin-inline: 0; } }
.footer-col h4 { font-size: 1rem; margin-bottom: 1rem; color: var(--primary); }

.footer-bottom { text-align: center; padding-top: 2rem; margin-top: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; }

/* Animations */
.fade-in { animation: fadeIn 0.8s var(--ease) forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

const t = (key) => I18N[state.lang][key] || key;

// 4. HELPERS
function updateLanguage() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  localStorage.setItem('df-lang', state.lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === state.lang);
  });
}

function initTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    localStorage.setItem('df-theme', state.theme);
  });
}

// 5. DATA FETCHING (Fixing the infinite loading)
async function fetchVideos() {
  state.isLoading = true;
  state.errorMsg = null;
  try {
    const { data, error } = await supabaseClient.from('videos').select('*').order('lesson_number', { ascending: true });
    if (error) throw error;
    state.videos = data || [];
  } catch (err) {
    console.error("Supabase Error:", err);
    state.videos = []; // Empty on error so it shows the empty state
    state.errorMsg = err.message;
  } finally {
    state.isLoading = false;
    render(); // Re-render after fetch completes
  }
}

function bindVideoEvents() {

// GitHub Upload Logic
window.uploadToGitHub = async function() {
  const lesson = document.getElementById('ghLesson').value;
  const repo = document.getElementById('ghRepo').value;
  const token = document.getElementById('ghToken').value;
  const fileInput = document.getElementById('ghFile');
  const btn = document.getElementById('ghBtn');
  const status = document.getElementById('ghStatus');

  if(!lesson || !repo || !token || !fileInput.files.length) {
    return alert('لطفاً تمام فیلدها را پر کنید.');
  }

  const file = fileInput.files[0];
  const path = `videos/${lesson}.mp4`;

  btn.disabled = true;
  status.textContent = 'در حال آپلود به گیت‌هاب (ممکن است طول بکشد)...';
  status.style.color = 'var(--primary)';

  try {
    // Convert file to Base64
    const reader = new FileReader();
    reader.readAsDataURL(file);
    
    reader.onload = async () => {
      const base64Content = reader.result.split(',')[1]; // remove data:video/mp4;base64,

      // Check if file exists to get SHA (needed for update)
      let sha = null;
      const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if(checkRes.ok) {
        const checkData = await checkRes.json();
        sha = checkData.sha;
      }

      // Upload to GitHub
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: `Upload lesson ${lesson}`,
          content: base64Content,
          sha: sha || undefined
        })
      });

      const data = await res.json();

      if(res.ok) {
        // Save to Supabase
        const downloadUrl = data.content.download_url;
        const { error } = await supabaseClient.from('videos').upsert(
          { lesson_number: parseInt(lesson), video_url: downloadUrl },
          { onConflict: 'lesson_number' }
        );

        if(error) throw error;

        status.textContent = '✅ ویدیو با موفقیت در گیت‌هاب آپلود و در دیتابیس ثبت شد!';
        status.style.color = 'green';
        fetchVideos(); // Refresh
      } else {
        throw new Error(data.message || 'خطا در آپلود');
      }
    };
  } catch(err) {
    status.textContent = '❌ خطا: ' + err.message;
    status.style.color = 'red';
    btn.disabled = false;
  }
};

window.saveToSupabase = async function() {
  const lesson = document.getElementById('sbLesson').value;
  const link = document.getElementById('sbLink').value;
  const btn = document.getElementById('sbBtn');
  const status = document.getElementById('sbStatus');

  if(!lesson || !link.startsWith('http')) return alert('اطلاعات را کامل وارد کنید');
  
  btn.disabled = true;
  status.textContent = 'در حال ذخیره...';
  status.style.color = 'var(--primary)';

  try {
    const { error } = await supabaseClient.from('videos').upsert(
      { lesson_number: parseInt(lesson), video_url: link },
      { onConflict: 'lesson_number' }
    );
    if(error) throw error;
    status.textContent = '✅ با موفقیت ذخیره شد!';
    status.style.color = 'green';
    fetchVideos(); // Refresh data
  } catch(err) {
    status.textContent = '❌ خطا: ' + err.message;
    status.style.color = 'red';
    btn.disabled = false;
  }
};

// 9. ROUTER
function router() {
  const hash = window.location.hash.replace('#/', '') || 'home';
  const route = hash.split('/')[0];
  state.route = route;

  document.querySelectorAll('[data-nav]').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === route);
  });

  if(route === 'videos') pages.videos();
  else if(route === 'about') pages.about();
  else if(route === 'contact') pages.contact();
  else if(route === 'admin') pages.admin();
  else pages.home();

  window.scrollTo(0, 0);
}

    state.lang = btn.dataset.lang;
    updateLanguage();
    router();
  });
});

window.addEventListener('hashchange', router);
