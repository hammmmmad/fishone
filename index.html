<style>
/* ═══════════ §1 TOKENS ═══════════ */
:root {
  --primary: #D46986; --primary-dark: #A9425D; --primary-light: #FDF2F5;
  --bg-color: #FCFBF9; --surface: #FFFFFF; --text-main: #2B282C; --text-muted: #7A757B;
  --border: #F0E6E9; --shadow-sm: 0 4px 12px rgba(212, 105, 134, 0.06);
  --shadow-lg: 0 24px 48px -12px rgba(212, 105, 134, 0.18);
  --radius: 24px; --radius-sm: 14px; --header-h: 72px; --bottom-nav-h: 70px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
  --bg-color: #141416; --surface: #1E1E22; --text-main: #F5F5F5; --text-muted: #A0A0A5;
  --border: #2D2B30; --primary-light: #2A1B20; --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 24px 48px -12px rgba(0,0,0,0.6);
}

/* ═══════════ §2 RESET ═══════════ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Vazirmatn', sans-serif; background-color: var(--bg-color); color: var(--text-main);
  line-height: 1.7; overflow-x: hidden; transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
  padding-bottom: var(--bottom-nav-h);
}
@media (min-width: 900px) { body { padding-bottom: 0; } }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
h1, h2, h3, h4 { font-weight: 800; line-height: 1.3; }
[lang="en"] h1, [lang="en"] h2, [lang="en"] h3, [lang="en"] .brand-name { font-family: 'Playfair Display', serif; }
.container { width: min(100% - 2rem, 1200px); margin-inline: auto; }

/* ═══════════ §3 HEADER & NAV ═══════════ */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--header-h);
  background: rgba(252, 251, 249, 0.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); transition: all 0.3s var(--ease);
}
[data-theme="dark"] .site-header { background: rgba(20, 20, 22, 0.85); }
.nav-wrap { display: flex; align-items: center; justify-content: space-between; height: 100%; }
.brand { display: flex; align-items: center; gap: 0.75rem; }
.logo-holder { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid var(--surface); box-shadow: var(--shadow-sm); transition: transform 0.4s var(--ease); }
.brand:hover .logo-holder { transform: scale(1.05) rotate(5deg); }
.logo-holder img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
.brand-name em { font-style: normal; color: var(--primary); }
.desktop-nav { display: none; gap: 0.5rem; background: var(--surface); padding: 0.35rem; border-radius: 999px; border: 1px solid var(--border); }
@media (min-width: 900px) { .desktop-nav { display: flex; } }
.desktop-nav a { padding: 0.6rem 1.2rem; border-radius: 999px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); transition: all 0.3s; }
.desktop-nav a:hover, .desktop-nav a.active { background: var(--primary-light); color: var(--primary); }
.nav-actions { display: flex; align-items: center; gap: 0.5rem; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); transition: all 0.3s var(--ease); }
.icon-btn:hover { background: var(--primary-light); color: var(--primary); }
.icon-btn svg { width: 20px; height: 20px; }
.lang-switch { display: flex; background: var(--surface); border-radius: 999px; padding: 0.25rem; border: 1px solid var(--border); }
.lang-switch button { padding: 0.3rem 0.8rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); transition: all 0.3s; }
.lang-switch button.active { background: var(--primary); color: #fff; }

/* Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-h); z-index: 100;
  background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
}
[data-theme="dark"] .bottom-nav { background: rgba(30, 30, 34, 0.95); }
@media (min-width: 900px) { .bottom-nav { display: none; } }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; transition: all 0.3s var(--ease); flex: 1; height: 100%; position: relative; }
.bottom-nav a .icon-box { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
.bottom-nav a svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }
.bottom-nav a.active { color: var(--primary); }
.bottom-nav a.active::before { content: ''; position: absolute; top: 0; width: 30%; height: 3px; background: var(--primary); border-radius: 0 0 3px 3px; }

/* ═══════════ §4 UI ELEMENTS ═══════════ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.9rem 1.8rem; border-radius: 999px; font-weight: 700; font-size: 0.95rem; transition: all 0.3s var(--ease); border: 1px solid transparent; white-space: nowrap; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.btn-outline { background: var(--surface); color: var(--text-main); border-color: var(--border); box-shadow: var(--shadow-sm); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); }
.btn-sm { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
.btn-block { width: 100%; }
.section { padding: 4rem 0; }
.section-header { text-align: center; margin-bottom: 3rem; }
.section-header h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 0.5rem; }
.section-header p { color: var(--text-muted); font-size: 1.05rem; }

/* ═══════════ §5 HERO ═══════════ */
.hero { position: relative; padding-top: calc(var(--header-h) + 4rem); padding-bottom: 5rem; text-align: center; overflow: hidden; }
.hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1920&q=80') center/cover; opacity: 0.08; z-index: -1; }
.hero-badge { display: inline-flex; padding: 0.4rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
.hero h1 { font-size: clamp(2.2rem, 6vw, 4rem); margin-bottom: 1.2rem; line-height: 1.2; }
.hero p { font-size: clamp(1rem, 2vw, 1.15rem); color: var(--text-muted); margin-bottom: 2.5rem; max-width: 600px; margin-inline: auto; }
.hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

/* ═══════════ §6 CARDS ═══════════ */
.reels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.reel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: all 0.4s var(--ease); display: flex; flex-direction: column; }
.reel-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
.reel-thumb { position: relative; aspect-ratio: 16/9; background: #222; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.reel-thumb video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
.reel-play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); cursor: pointer; }
.reel-play-btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); display: grid; place-items: center; color: var(--primary); font-size: 1.2rem; transition: transform 0.3s var(--ease); }
.reel-card:hover .reel-play-btn { transform: scale(1.1); background: var(--primary); color: #fff; }
.reel-badge { position: absolute; top: 1rem; right: 1rem; background: var(--surface); color: var(--primary); padding: 0.2rem 0.8rem; border-radius: 999px; font-size: 0.75rem; font-weight: 800; box-shadow: var(--shadow-sm); }
[dir="rtl"] .reel-badge { right: auto; left: 1rem; }
.reel-body { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }
.reel-body h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.reel-body p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.2rem; flex: 1; }
.reel-actions { display: flex; gap: 0.5rem; }

/* ═══════════ §7 MODAL ═══════════ */
.modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
.modal.open { display: flex; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
.modal-box { position: relative; background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 500px; overflow: hidden; box-shadow: var(--shadow-lg); z-index: 1; animation: modalIn 0.3s var(--ease); }
@keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-close { position: absolute; top: 1rem; right: 1rem; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; display: grid; place-items: center; cursor: pointer; }
.modal-video { aspect-ratio: 16/9; background: #000; }
.modal-video video { width: 100%; height: 100%; object-fit: contain; }
.modal-info { padding: 1.5rem; }
.modal-info h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
.modal-info p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }

/* ═══════════ §8 ADMIN PANEL ═══════════ */
.admin-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: calc(var(--header-h) + 2rem) 1rem 2rem; }
.admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 500px; box-shadow: var(--shadow-lg); }
.admin-card h2 { text-align: center; color: var(--primary); margin-bottom: 1.5rem; }
.form-group { margin-bottom: 1.2rem; }
.form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; }
.form-input { width: 100%; padding: 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-family: inherit; font-size: 1rem; transition: border-color 0.3s; }
.form-input:focus { outline: none; border-color: var(--primary); }
.admin-status { text-align: center; font-size: 0.9rem; margin-top: 1rem; font-weight: 600; }

/* ═══════════ §9 FOOTER ═══════════ */
.site-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 3rem 0 1.5rem; margin-top: 3rem; text-align: center; }
.footer-content { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.footer-content p { color: var(--text-muted); font-size: 0.9rem; }
.social-links { display: flex; gap: 1rem; margin-top: 1rem; }
.social-links a { color: var(--primary); font-weight: 700; font-size: 0.9rem; }
</style>

<script>
"use strict";

// 1. CONFIG
const SUPABASE_URL = "https://ftorrprlveukbqhkwtgk.supabase.co";
const SUPABASE_KEY = "sb_publishable_klxW4W61vXPqwEqRrm8jGQ_omkppRPq";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");
const state = {
  lang: localStorage.getItem("df-lang") || "fa",
  theme: localStorage.getItem("df-theme") || "light",
  route: "home",
  videos: [],
  loading: true,
  error: null
};

// ⬇️⬇️⬇️ **بخش بسیار مهم: جایگزینی لینک‌های گیت‌هاب** ⬇️⬇️⬇️
// ویدیوهای خود را در گیت‌هاب آپلود کنید، لینک Raw آنها را کپی کنید و اینجا قرار دهید.
const FALLBACK_VIDEOS = [
  { lesson_number: 1, video_url: "https://raw.githubusercontent.com/username/repo/main/videos/1.mp4" },
  { lesson_number: 2, video_url: "https://raw.githubusercontent.com/username/repo/main/videos/2.mp4" },
  { lesson_number: 3, video_url: "https://raw.githubusercontent.com/username/repo/main/videos/3.mp4" }
  // ... تا ویدیوی ۱۵ (و بقیه) را اینجا اضافه کنید ...
];
// ⬆️⬆️⬆️ **مابقی ویدیوها را اینجا اضافه کنید** ⬆️⬆️⬆️

// 2. I18N
const I18N = {
  fa: {
    "nav.home": "خانه", "nav.videos": "دوره", "nav.about": "درباره", "nav.contact": "تماس",
    "hero.badge": "دوره آموزشی ۴۵ روزه",
    "hero.title": "بیاموزید، خلاقیت به خرج دهید و بدرخشید",
    "hero.lead": "دیلی فشن دوره آموزشی ۴۵ روزه را با ویدیوهای رایگان ارائه می‌دهد — از آرایش و زیبایی تا فشن و سبک زندگی.",
    "hero.cta": "شروع دوره", "hero.cta2": "درباره ما",
    "section.videos": "کتابخانه ویدیویی", "section.videos.sub": "درس‌های گام به گام برای یادگیری شما",
    "reels.download": "دانلود ویدیو",
    "footer.tagline": "آموزش رایگان آرایش، زیبایی و فشن برای همه.",
    "footer.channel": "کانال واتس‌اپ", "footer.rights": "© ۲۰۲۶ دیلی فشن افغانستان. تمام حقوق محفوظ است."
  },
  en: {
    "nav.home": "Home", "nav.videos": "Course", "nav.about": "About", "nav.contact": "Contact",
    "hero.badge": "45-Day Course",
    "hero.title": "Learn, Create & Shine",
    "hero.lead": "Daily Fashion AF offers a free 45-day training course — from beauty and makeup to fashion and lifestyle.",
    "hero.cta": "Start Course", "hero.cta2": "About Us",
    "section.videos": "Video Library", "section.videos.sub": "Step-by-step lessons for your growth",
    "reels.download": "Download Video",
    "footer.tagline": "Free beauty, makeup and fashion education for everyone.",
    "footer.channel": "WhatsApp Channel", "footer.rights": "© 2026 Daily Fashion AF. All Rights Reserved."
  }
};
const t = (key) => I18N[state.lang][key] || key;

function updateLanguage() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  localStorage.setItem('df-lang', state.lang);
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('.lang-switch button').forEach(b => { b.classList.toggle('active', b.dataset.lang === state.lang); });
}

// 3. THEME
function initTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    localStorage.setItem('df-theme', state.theme);
  });
}

// 4. FETCH DATA (با سیستم پشتیبان Fallback)
async function fetchVideos() {
  state.loading = true;
  state.error = null;
  try {
    // تلاش برای خواندن از Supabase
    const { data, error } = await supabaseClient.from('videos').select('*').order('lesson_number', { ascending: true });
    
    if (error) throw error;
    
    if (data && data.length > 0) {
      state.videos = data;
      console.log("ویدیوها از Supabase لود شدند.");
    } else {
      // اگر Supabase خالی بود یا قطع بود، از Fallback استفاده کن
      throw new Error("Supabase Empty");
    }
  } catch (err) {
    console.warn("Supabase در دسترس نیست. استفاده از ویدیوهای پیش‌فرض (گیت‌هاب).");
    state.error = "نمایش نسخه پشتیبان (گیت‌هاب)";
    state.videos = FALLBACK_VIDEOS; // استفاده از لینک‌های گیت‌هاب
  } finally {
    state.loading = false;
    router(); 
  }
}

// 5. COMPONENTS
function videoCard(v) {
  let dlUrl = v.video_url;
  if(dlUrl.includes('supabase.co') && !dlUrl.includes('?download')) dlUrl += '?download';

  return `
    <article class="reel-card">
      <div class="reel-thumb">
        <video src="${v.video_url}#t=0.5" preload="metadata" muted></video>
        <div class="reel-play-overlay" onclick="openModal('${v.video_url}', ${v.lesson_number})">
          <div class="reel-play-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.3-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14Z"/></svg>
          </div>
        </div>
        <span class="reel-badge">${state.lang === 'fa' ? 'دوره' : 'Course'} ${v.lesson_number}</span>
      </div>
      <div class="reel-body">
        <h3>${state.lang === 'fa' ? 'درس' : 'Lesson'} ${v.lesson_number}</h3>
        <p>${state.lang === 'fa' ? 'آموزش گام به گام دیلی فشن' : 'Daily Fashion step-by-step'}</p>
        <div class="reel-actions">
          <button class="btn btn-outline btn-sm" onclick="openModal('${v.video_url}', ${v.lesson_number})">${state.lang === 'fa' ? 'تماشا' : 'Watch'}</button>
          <a href="${dlUrl}" download="lesson-${v.lesson_number}.mp4" class="btn btn-primary btn-sm">${state.lang === 'fa' ? 'دانلود' : 'Download'}</a>

      </div>

  `;
}

// 7. LOGIC & EVENTS
window.openModal = function(src, lesson) {
  const modal = document.getElementById('modal');
  const videoBox = document.getElementById('modalVideo');
  document.getElementById('modalTitle').textContent = state.lang === 'fa' ? `دوره ${lesson}` : `Course ${lesson}`;
  document.getElementById('modalDesc').textContent = state.lang === 'fa' ? `آموزش گام به گام دیلی فشن` : `Daily Fashion step-by-step`;
  
  let dlUrl = src;
  if(dlUrl.includes('supabase.co') && !dlUrl.includes('?download')) dlUrl += '?download';
  document.getElementById('modalDownload').href = dlUrl;

  videoBox.innerHTML = `<video src="${src}" controls autoplay playsinline></video>`;
  modal.classList.add('open');
}

document.querySelectorAll('[data-close]').forEach(el => {
  el.addEventListener('click', () => {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modalVideo').innerHTML = '';
  });
});

// 8. ROUTER
function router() {
  const hash = window.location.hash.replace('#/', '') || 'home';
  const route = hash.split('/')[0];
  state.route = route;

  document.querySelectorAll('[data-nav]').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === route);
  });

  if(route === 'videos') pages.videos();
  else if(route === 'about') pages.about();
  else if(route === 'contact') pages.contact();
  else pages.home();

  window.scrollTo(0, 0);
}

// 9. INIT
document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.lang = btn.dataset.lang;
    updateLanguage();
    router(); 
  });
});

window.addEventListener('hashchange', router);

(async function init() {
  initTheme();
  updateLanguage();
  await fetchVideos();
})();
