<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9a6bb">
<title>Daily Fashion AF — دوره ۴۵ روزه</title>
<meta name="relly Fashion AF — دوره ۴۵ روزه با ۱۲ درس ویدیویی رایگان.">
<img src/image/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ═══════════ INIT THEME (بدون پرش صفحه) ═══════════ -->
<script>
(function(){
  var t = localStorage.getItem('df-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  var l = localStorage.getItem('df-lang') || 'fa';
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   §1  TOKENS & DARK MODE
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#141418; --ink-2:#3a3a45; --muted:#7a7a86;
  --pink:#e9a6bb; --pink-deep:#c76e8c; --pink-rose:#a84a6b;
  --pink-light:#fdeef3; --pink-line:#f3d4df;
  --beige:#faf6f1; --gray:#f4f4f6; --white:#fff;
  --radius:26px; --radius-sm:16px; --radius-xs:12px;
  --shadow-xs:0 1px 2px rgba(20,20,24,.06);
  --shadow-sm:0 6px 18px -6px rgba(20,20,24,.10);
  --shadow-md:0 22px 46px -20px rgba(168,74,107,.32);
  --shadow-lg:0 38px 80px -34px rgba(168,74,107,.48);
  --container:1200px; --header-h:78px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --reel-min:220px; --reel-ratio:9/14; --logo-size:48px;
}

[data-theme="dark"]{
  --ink:#f0f0f4; --ink-2:#c4c4cc; --muted:#8e8e98;
  --pink-light:#2a1a20; --pink-line:#4a2b36;
  --beige:#1c1c21; --gray:#24242b; --white:#141418;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 6px 18px -6px rgba(0,0,0,.6);
  --shadow-md:0 22px 46px -20px rgba(0,0,0,.6);
  --shadow-lg:0 38px 80px -34px rgba(0,0,0,.8);
}

/* ═══════════ §2 RESET ═══════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:'Vazirmatn',system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s, color .3s}
html[lang="en"] body{line-height:1.7;font-family:'Inter','Vazirmatn',sans-serif}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em;font-weight:800}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,html[lang="en"] .brand-name{font-family:'Playfair Display',serif;font-weight:600;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--pink-rose);outline-offset:3px;border-radius:8px}
::selection{background:var(--pink);color:#fff}
.container{width:min(100% - 2.5rem,var(--container));margin-inline:auto}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ico svg{width:1em;height:1em;display:block}
html[dir="rtl"] .play-fab .ico,html[dir="rtl"] .card-link .ico,html[dir="rtl"] .back-link .ico{transform:scaleX(-1)}

/* ═══════════ §3 HEADER (With Round Logo) ═══════════ */
.site-header{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid #f3e7ec;transition:background-color .3s, border-color .3s}
[data-theme="dark"] .site-header{background:rgba(20,20,24,.85);border-bottom-color:#2a2a33}
.nav-wrap{display:flex;align-items:center;gap:1rem;height:var(--header-h)}
.brand{display:flex;align-items:center;gap:.75rem;flex:0 0 auto;perspective:600px}
.logo-holder{position:relative;width:var(--logo-size);height:var(--logo-size);display:grid;place-items:center;flex:0 0 auto;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--pink-light),#fff);border:2px solid var(--white);box-shadow:0 8px 24px -10px rgba(168,74,107,.45), inset 0 0 0 1px rgba(243,212,223,.9);transition:transform .6s var(--ease), box-shadow .4s, border-color .3s}
[data-theme="dark"] .logo-holder{background:linear-gradient(135deg,#2a1a20,#141418);border-color:#2a2a33}
.brand:hover .logo-holder{transform:rotateY(18deg) rotateX(-10deg) scale(1.07)}
.logo-holder .logo-3d{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.logo-fb-icon{display:none;width:100%;height:100%;background:linear-gradient(135deg,var(--pink),var(--pink-deep));border-radius:50%;color:#fff;font-weight:800;font-size:.85rem;place-items:center;letter-spacing:.02em}
.logo-holder.logo-fb .logo-3d{display:none}
.logo-holder.logo-fb .logo-fb-icon{display:grid}
.brand-text{display:flex;flex-direction:column;line-height:1.12}
.brand-name{font-size:1.06rem;font-weight:800;color:var(--ink)}
.brand-name em{font-style:normal;color:var(--pink-deep)}
.brand-sub{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
html[lang="fa"] .brand-sub{letter-spacing:.02em;text-transform:none;font-size:.72rem}
.main-nav{display:flex;align-items:center;gap:.15rem;margin-inline:auto}
.main-nav a{padding:.55rem 1rem;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--ink-2);transition:.25s;position:relative;white-space:nowrap}
.main-nav a:hover,.main-nav a.active{background:var(--pink-light);color:var(--pink-deep)}
.main-nav a.active{font-weight:700}
.nav-actions{display:flex;align-items:center;gap:.55rem}

/* ═══════════ Theme Toggle & Lang ═══════════ */
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--gray);display:grid;place-items:center;color:var(--ink-2);transition:background .25s,color .25s,transform .25s}
.icon-btn:hover{background:var(--pink-light);color:var(--pink-deep);transform:scale(1.05)}
.icon-btn svg{width:20px;height:20px;transition:transform .3s}
[data-theme="dark"] .icon-btn svg{transform:rotate(180deg)}
.lang-switch{display:flex;background:var(--gray);border-radius:999px;padding:4px;gap:2px;border:1px solid var(--gray)}
.lang-switch button{padding:.34rem .78rem;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--muted);transition:.25s}
.lang-switch button:hover{color:var(--pink-deep)}
.lang-switch button.active{background:var(--white);color:var(--pink-deep);box-shadow:0 2px 8px rgba(0,0,0,.09)}
.burger{display:none;width:44px;height:44px;border-radius:13px;background:var(--gray);place-items:center;color:var(--ink);transition:.25s}
.burger:hover{background:var(--pink-light);color:var(--pink-deep)}

/* ═══════════ §4 BUTTONS ═══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.9rem 1.8rem;border-radius:999px;font-weight:700;font-size:.92rem;transition:transform .3s var(--ease),box-shadow .3s,background .3s,color .3s,border-color .3s;border:1px solid transparent;line-height:1.2;white-space:nowrap;cursor:pointer}
.btn .ico{font-size:1.1em}
.btn-primary{background:linear-gradient(135deg,var(--pink) 0%,var(--pink-deep) 100%);color:#fff;box-shadow:0 14px 28px -12px rgba(168,74,107,.85), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 22px 40px -16px rgba(168,74,107,1)}
.btn-ghost{background:var(--white);color:var(--ink);border-color:var(--pink-line);box-shadow:var(--shadow-xs)}
.btn-ghost:hover{border-color:var(--pink);color:var(--pink-deep);transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.btn-dark{background:linear-gradient(135deg,#2a2a33,#141418);color:#fff;box-shadow:0 14px 28px -14px rgba(20,20,24,.7)}
.btn-dark:hover{transform:translateY(-3px);box-shadow:0 20px 36px -16px rgba(20,20,24,.85)}
.btn-sm{padding:.62rem 1.15rem;font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;background:var(--white);border:1px solid var(--pink-line);color:var(--pink-deep);font-size:.76rem;font-weight:700;padding:.45rem 1.05rem;border-radius:999px;box-shadow:var(--shadow-xs)}

/* ═══════════ §5 HERO ═══════════ */
.hero{position:relative;background:var(--beige);overflow:hidden;isolation:isolate;transition:background-color .3s}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;transform:scale(1.04);z-index:-2;background-image:url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1920&q=80");opacity:.9}
[data-theme="dark"] .hero-bg{opacity:.3}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to right,rgba(250,246,241,.98) 0%,rgba(250,246,241,.92) 42%,rgba(250,246,241,.30) 100%)}
[data-theme="dark"] .hero::before{background:linear-gradient(to right,rgba(28,28,33,.98) 0%,rgba(28,28,33,.92) 42%,rgba(28,28,33,.30) 100%)}
html[dir="rtl"] .hero::before{transform:scaleX(-1)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:-1;animation:floaty 9s ease-in-out infinite}
.orb-a{width:340px;height:340px;background:radial-gradient(circle,rgba(233,166,187,.9),transparent 70%);top:-120px;inset-inline-start:-80px}
.orb-b{width:260px;height:260px;background:radial-gradient(circle,rgba(168,74,107,.55),transparent 70%);bottom:-100px;inset-inline-end:8%;animation-delay:-3s}
.orb-c{width:180px;height:180px;background:radial-gradient(circle,rgba(255,220,232,.9),transparent 70%);top:38%;inset-inline-end:26%;animation-delay:-6s}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.06)}}
.hero-inner{position:relative;z-index:2;max-width:680px;padding-block:clamp(3.5rem,8vw,6.8rem)}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.14;margin:1.1rem 0 1rem;letter-spacing:-.025em}
.hero .lead{color:var(--ink-2);font-size:clamp(.96rem,1.55vw,1.1rem);max-width:58ch;line-height:1.85}
.hero-actions{display:flex;flex-wrap:wrap;gap:.85rem;margin-top:2rem}
.hero-stats{display:flex;flex-wrap:wrap;gap:clamp(1rem,3.5vw,2.6rem);margin-top:2.8rem;padding:1.3rem 1.5rem;background:rgba(255,255,255,.72);border:1px solid rgba(243,212,223,.9);border-radius:var(--radius);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 44px -24px rgba(168,74,107,.4), inset 0 1px 0 rgba(255,255,255,.9);width:fit-content;max-width:100%}
[data-theme="dark"] .hero-stats{background:rgba(20,20,24,.72);border-color:rgba(74,43,54,.9);box-shadow:0 20px 44px -24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05)}
.hero-stats>div{display:flex;flex-direction:column;gap:.1rem}
.hero-stats strong{font-size:1.7rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;background:linear-gradient(135deg,var(--pink-rose),var(--pink-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stats span{font-size:.78rem;color:var(--muted);font-weight:500}

/* ═══════════ §6 SECTIONS ═══════════ */
.section{padding-block:clamp(3rem,7vw,5.5rem);transition:background-color .3s}
.section-alt{background:var(--beige)}
.section-head{text-align:center;max-width:680px;margin:0 auto clamp(2rem,4vw,3.2rem)}
.eyebrow{display:inline-block;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--pink-deep);font-weight:800;margin-bottom:.65rem}
html[lang="fa"] .eyebrow{letter-spacing:.02em;text-transform:none;font-size:.82rem}
.section-head h2{font-size:clamp(1.65rem,3.8vw,2.5rem);margin-bottom:.7rem}
.section-head p{color:var(--muted);font-size:1rem;line-height:1.8}

/* ═══════════ §7 REELS GRID (با کاور ویدیو) ═══════════ */
.reels-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(var(--reel-min), 1fr));gap:1.6rem}
.reel-card{background:var(--white);border:1px solid #f3e8ec;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s,background-color .3s}
[data-theme="dark"] .reel-card{border-color:#2a2a33}
.reel-card:hover{box-shadow:var(--shadow-md)}

/* ویدیو پیش‌نمایش به عنوان کاور */
.reel-thumb{position:relative;aspect-ratio:var(--reel-ratio, 9/14);background-color:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;padding:0;border:0;cursor:pointer}
.reel-thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.reel-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,20,24,.7),rgba(20,20,24,0) 55%);z-index:1;pointer-events:none}
.reel-thumb .play-fab{width:56px;height:56px;background:rgba(255,255,255,.95);color:var(--pink-deep);z-index:3;position:relative}
.reel-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:3.5rem;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 4px 20px rgba(0,0,0,.6);z-index:2;pointer-events:none;font-family:'Playfair Display',serif}
html[dir="rtl"] .reel-num{transform:translate(50%,-50%)}
.reel-badge{position:absolute;top:.85rem;inset-inline-start:.85rem;z-index:3;background:rgba(255,255,255,.96);color:var(--pink-deep);font-size:.68rem;font-weight:800;padding:.25rem .7rem;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.reel-body{padding:1.05rem 1.15rem 1.2rem;display:flex;flex-direction:column;gap:.45rem;flex:1;z-index:4}
.reel-body h3{font-size:1rem;line-height:1.35}
.reel-body p{color:var(--muted);font-size:.82rem;flex:1;line-height:1.7}
.reel-actions{display:flex;gap:.5rem;margin-top:.6rem}
.reel-actions .btn{flex:1;padding:.55rem .6rem;font-size:.78rem}
.play-fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);transition:transform .35s var(--ease),background .3s,color .3s}
.reel-card:hover .play-fab{background:var(--pink-deep);color:#fff;transform:scale(1.12)}

/* ═══════════ §8 PAGE HEADER ═══════════ */
.page-head{padding-block:clamp(2.4rem,5vw,3.6rem) 1rem;text-align:center;background:var(--beige);border-bottom:1px solid #f3e8ec;position:relative;overflow:hidden;transition:background-color .3s,border-color .3s}
[data-theme="dark"] .page-head{border-bottom-color:#2a2a33}
.page-head::before{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(233,166,187,.25),transparent 70%);top:-200px;left:50%;transform:translateX(-50%);pointer-events:none}
.page-head h1{font-size:clamp(1.8rem,4.2vw,2.8rem);margin-bottom:.6rem;position:relative}
.page-head p{color:var(--muted);max-width:60ch;margin-inline:auto;font-size:1rem;position:relative}

/* ═══════════ §9 LIFESTYLE ═══════════ */
.lifestyle-block{margin-bottom:clamp(3rem,6vw,4.5rem)}
.lifestyle-head{display:flex;align-items:center;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap}
.lifestyle-head h2{font-size:clamp(1.4rem,3vw,1.9rem)}
.lifestyle-head .accent{display:inline-flex;align-items:center;gap:.5rem;background:var(--pink-light);color:var(--pink-deep);font-size:.76rem;font-weight:800;padding:.4rem .95rem;border-radius:999px;border:1px solid var(--pink-line)}
.lifestyle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
.life-card{background:var(--white);border:1px solid #f3e8ec;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:background-color .3s,border-color .3s}
[data-theme="dark"] .life-card{border-color:#2a2a33}
.life-img{aspect-ratio:4/3;background-size:cover;background-position:center;position:relative}
.life-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,20,24,.32),transparent 55%)}
.life-body{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.life-body h3{font-size:1.08rem}
.life-body p{color:var(--muted);font-size:.87rem;flex:1;line-height:1.75}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.tag{font-size:.7rem;font-weight:700;color:var(--pink-deep);background:var(--pink-light);padding:.22rem .65rem;border-radius:999px;border:1px solid var(--pink-line)}

/* ═══════════ §10 ABOUT & FOUNDER ═══════════ */
.about-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2rem;align-items:center;margin-bottom:clamp(2.5rem,5vw,3.5rem)}
.about-hero-img{border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;background-size:cover;background-position:center;box-shadow:var(--shadow-lg);border:1px solid #f3e8ec}
[data-theme="dark"] .about-hero-img{border-color:#2a2a33}
.about-hero-text h2{font-size:clamp(1.5rem,3.4vw,2.1rem);margin-bottom:.8rem}
.about-hero-text p{color:var(--ink-2);font-size:1.02rem;line-height:1.9}

/* بخش معرفی عرش نیکزاد */
.founder-card{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:2rem;align-items:center;
  background:linear-gradient(160deg,var(--pink-light),var(--white) 60%);
  border:1px solid var(--pink-line);border-radius:var(--radius);
  padding:clamp(1.5rem,3.5vw,2.6rem);box-shadow:var(--shadow-md);
  margin-bottom:clamp(2.5rem,5vw,3.5rem);position:relative;overflow:hidden;
  transition:background .3s,border-color .3s;
}
[data-theme="dark"] .founder-card{background:linear-gradient(160deg,#2a1a20,#1c1c21 60%);border-color:#4a2b36}
.founder-img{
  border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:4/5;
  background-size:cover;background-position:center;
  box-shadow:0 20px 40px -22px rgba(168,74,107,.6);
  border:3px solid var(--white);
}
[data-theme="dark"] .founder-img{border-color:#2a2a33}
.founder-text h2{font-size:clamp(1.4rem,3.5vw,2rem);margin-bottom:.4rem;color:var(--ink)}
.founder-text .role{display:inline-block;background:var(--pink-deep);color:#fff;font-size:.8rem;font-weight:700;padding:.25rem .8rem;border-radius:999px;margin-bottom:1rem}
.founder-text p{color:var(--ink-2);font-size:1rem;line-height:1.9;margin-bottom:1rem;font-style:italic;position:relative;padding-inline-start:1rem;border-inline-start:3px solid var(--pink)}
.founder-text .signature{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--pink-deep);font-weight:700;margin-top:1rem}

/* بخش افغانستان */
.afghan-lifestyle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:2rem;align-items:center;background:var(--gray);border:1px solid #f3e8ec;border-radius:var(--radius);padding:clamp(1.5rem,3.5vw,2.6rem);box-shadow:var(--shadow-sm);transition:background .3s,border-color .3s}
[data-theme="dark"] .afghan-lifestyle{border-color:#2a2a33}
.afghan-lifestyle-img{border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:4/3;background-size:cover;background-position:center;box-shadow:0 20px 40px -22px rgba(0,0,0,.3)}
.afghan-lifestyle h2{font-size:clamp(1.3rem,3vw,1.85rem);margin-bottom:.7rem}
.afghan-lifestyle p{color:var(--ink-2);font-size:.98rem;line-height:1.9;margin-bottom:.8rem}
.afghan-lifestyle p:last-child{margin-bottom:0}

.channel-card{background:linear-gradient(150deg,#eafaf0 0%,var(--white) 60%);border:1px solid #c9efd8;border-radius:var(--radius);padding:clamp(1.5rem,3.2vw,2.4rem);display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;box-shadow:var(--shadow-sm);transition:background .3s,border-color .3s}
[data-theme="dark"] .channel-card{background:linear-gradient(150deg,#16291e 0%,#1c1c21 60%);border-color:#1e5c35}
.channel-icon{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:#25D366;color:#fff;font-size:1.6rem;box-shadow:0 16px 30px -14px rgba(37,211,102,.9)}
.channel-card h3{font-size:1.22rem}

/* ═══════════════════════════════════════════════════════════════
   §7 STATE & HELPERS
   ═══════════════════════════════════════════════════════════════ */
const app = document.getElementById("app");
const state = { lang: (localStorage.getItem("df-lang") === "en") ? "en" : "fa" };

const t  = key => { const d = I18N[state.lang] || I18N.fa; return d[key] !== undefined ? d[key] : (I18N.fa[key] || key); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function applyLanguage(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir  = state.lang === "fa" ? "rtl" : "ltr";
  localStorage.setItem("df-lang", state.lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t(el.dataset.i18n);
    if(v !== el.dataset.i18n) el.textContent = v;
  });
  document.querySelectorAll(".lang-switch button").forEach(b => {
    const a = b.dataset.lang === state.lang;
    b.classList.toggle("active", a);
    b.setAttribute("aria-pressed", a ? "true" : "false");
  });
}
function setLanguage(lang){
  if(lang === state.lang || (lang !== "fa" && lang !== "en")) return;
  state.lang = lang;
  applyLanguage();
  render({ scroll: false });
}

/* ═══════════════════════════════════════════════════════════════
   §8 ROUTER
   ═══════════════════════════════════════════════════════════════ */
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, "") || "home";
  const p = raw.split("/").filter(Boolean);
  return { name: p[0] || "home" };
}
function render(opts){
  const o = opts || {};
  const r = parseHash();

  if(r.name === "videos")          pages.videos();
  else if(r.name === "lifestyle")  pages.lifestyle();
  else if(r.name === "about")      pages.about();
  else if(r.name === "shop")       pages.shop();
  else if(r.name === "contact")    pages.contact();
  else                             pages.home();

  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === r.name));
  if(o.scroll !== false) window.scrollTo({ top: 0, behavior: "auto" });
}

/* ═══════════════════════════════════════════════════════════════
   §9 TOAST
   ═══════════════════════════════════════════════════════════════ */
let toastTimer = 0;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = ico("check") + "<span>" + esc(msg) + "</span>";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

/* ═══════════════════════════════════════════════════════════════
   §10 MODAL (Video Player & Download)
   ═══════════════════════════════════════════════════════════════ */
function openReel(index){
  const reel = REELS[index];
  if(!reel) return;

  document.getElementById("modalTitle").textContent = reel.title[state.lang];
  document.getElementById("modalDesc").textContent  = reel.desc[state.lang];

  // دکمه دانلود اصلی
  const dlBtn = document.getElementById("modalDownload");
  dlBtn.href = reel.src;
  dlBtn.setAttribute("download", `DailyFashion-Lesson-${index + 1}.mp4`);

  const videoBox = document.getElementById("modalVideo");
  videoBox.innerHTML = "";
  const video = document.createElement("video");
  video.src = reel.src;
  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;
  video.setAttribute("aria-label", reel.title[state.lang]);
  videoBox.appendChild(video);

  const modal = document.getElementById("modal");
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeReel(){
  const modal = document.getElementById("modal");
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.getElementById("modalVideo").innerHTML = "";
  document.body.style.overflow = "";
}

function bindReelButtons(){
  document.querySelectorAll("[data-reel]").forEach(btn => {
    if(btn._bound) return;
    btn._bound = true;
    btn.addEventListener("click", () => openReel(parseInt(btn.dataset.reel, 10)));
  });
}

/* ═══════════════════════════════════════════════════════════════
   §13 INITIALIZATION & THEME
   ═══════════════════════════════════════════════════════════════ */
function initTheme(){
  const btn = document.getElementById("themeToggle");
  const html = document.documentElement;
  
  btn.addEventListener("click", () => {
    const current = html.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    localStorage.setItem("df-theme", next);
  });
}

(function init(){
  applyLanguage();
  initTheme();

  document.querySelectorAll(".lang-switch button").forEach(btn =>
    btn.addEventListener("click", () => setLanguage(btn.dataset.lang)));

  const burger = document.getElementById("burger");
  const nav    = document.getElementById("mainNav");
  burger.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    burger.setAttribute("aria-expanded", open ? "true" : "false");
    burger.innerHTML = open
      ? '<span class="ico" style="font-size:1.3rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>'
      : '<span class="ico" style="font-size:1.3rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>';
  });
  nav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
    nav.classList.remove("open");
    burger.setAttribute("aria-expanded", "false");
  }));

  document.querySelectorAll("#modal [data-close]").forEach(el => el.addEventListener("click", closeReel));
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && document.getElementById("modal").classList.contains("open")) closeReel();
  });

  window.addEventListener("hashchange", () => render());
  if(!location.hash) location.hash = "#/home";
  render();
})();
</script>
