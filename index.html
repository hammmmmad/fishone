<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D46986">
<title>Daily Fashion AF | Premium</title>
<link rel="icon" href="image/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script>
(function(){
  document.documentElement.setAttribute('data-theme', localStorage.getItem('df-theme') || 'light');
  var l = localStorage.getItem('df-lang') || 'fa';
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   §1 PREMIUM TOKENS
   ═══════════════════════════════════════════════════════════════ */
:root{
  --primary:#D46986; --primary-dark:#A9425D; --primary-light:#FFF0F4;
  --bg:#F8F6F4; --surface:#FFFFFF; --text:#1A181B; --muted:#6B666C;
  --border:#EBE3E6; --shadow-sm:0 4px 15px rgba(212,105,134,.08);
  --shadow-lg:0 20px 40px -10px rgba(212,105,134,.2);
  --radius:20px; --radius-sm:12px; --header-h:76px; --nav-h:72px;
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --bg:#0E0E10; --surface:#18181B; --text:#F4F4F5; --muted:#A1A1AA;
  --border:#27272A; --primary-light:#2A181E;
  --shadow-sm:0 4px 15px rgba(0,0,0,.4);
  --shadow-lg:0 20px 40px -10px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;transition:background-color .4s var(--ease);padding-bottom:var(--nav-h)}
@media(min-width:900px){body{padding-bottom:0}}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-weight:800;line-height:1.3}
[lang="en"] h1,[lang="en"] h2,[lang="en"] h3,[lang="en"] .brand-name{font-family:'Playfair Display',serif}
.container{width:min(100% - 2rem,1200px);margin-inline:auto}

/* Animations */
.fade-in { animation: fadeIn 0.6s var(--ease) forwards; opacity: 0; transform: translateY(10px); }
@keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

/* ═══════════════════════════════════════════════════════════════
   §2 HEADER & NAV
   ═══════════════════════════════════════════════════════════════ */
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-h);background:rgba(248,246,244,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
[data-theme="dark"] .site-header{background:rgba(14,14,16,.85)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.brand{display:flex;align-items:center;gap:.8rem}
.logo-holder{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);box-shadow:var(--shadow-sm)}
.logo-holder img{width:100%;height:100%;object-fit:cover}
.brand-name{font-size:1.3rem;font-weight:900;letter-spacing:-.03em}
.brand-name em{font-style:normal;color:var(--primary)}
.desktop-nav{display:none;gap:.5rem;background:var(--surface);padding:.4rem;border-radius:999px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
@media(min-width:900px){.desktop-nav{display:flex}}
.desktop-nav a{padding:.6rem 1.4rem;border-radius:999px;font-size:.9rem;font-weight:700;color:var(--muted);transition:all .3s}
.desktop-nav a:hover,.desktop-nav a.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(212,105,134,.3)}
.nav-actions{display:flex;align-items:center;gap:.6rem}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text);transition:all .3s;box-shadow:var(--shadow-sm)}
.icon-btn:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary-light)}
.icon-btn svg{width:20px;height:20px}
.lang-switch{display:flex;background:var(--surface);border-radius:999px;padding:.3rem;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.lang-switch button{padding:.3rem .9rem;border-radius:999px;font-size:.8rem;font-weight:800;color:var(--muted);transition:.3s}
.lang-switch button.active{background:var(--text);color:var(--surface)}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
[data-theme="dark"] .bottom-nav{background:rgba(24,24,27,.9)}
@media(min-width:900px){.bottom-nav{display:none}}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;color:var(--muted);font-size:.7rem;font-weight:700;transition:all .3s;flex:1;height:100%;position:relative}
.bottom-nav a .icon-box{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bottom-nav a svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav a.active::before{content:'';position:absolute;top:0;width:40%;height:4px;background:var(--primary);border-radius:0 0 4px 4px}

/* ═══════════════════════════════════════════════════════════════
   §3 BUTTONS & SECTIONS
   ═══════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:1rem 2rem;border-radius:999px;font-weight:800;font-size:.95rem;transition:all .4s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 8px 20px -6px rgba(212,105,134,.5)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 25px -6px rgba(212,105,134,.6)}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
.btn-sm{padding:.6rem 1.2rem;font-size:.85rem}
.btn-block{width:100%}

.section{padding:5rem 0}
.section-alt{background:var(--primary-light)}
.section-header{text-align:center;margin-bottom:3rem}
.section-header h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:.5rem;letter-spacing:-.02em}
.section-header p{color:var(--muted);font-size:1.05rem;font-weight:500}

.page-head { padding-top: calc(var(--header-h) + 4rem); padding-bottom: 3rem; text-align: center; background: var(--surface); border-bottom: 1px solid var(--border); }
.page-head h1 { font-size: clamp(2rem, 5vw, 3rem); color: var(--text); margin-bottom: 0.5rem; letter-spacing: -0.03em; }
.page-head p { color: var(--muted); font-size: 1.1rem; font-weight: 500; }

/* ═══════════════════════════════════════════════════════════════
   §4 HERO
   ═══════════════════════════════════════════════════════════════ */
.hero{position:relative;padding-top:calc(var(--header-h) + 6rem);padding-bottom:7rem;text-align:center;overflow:hidden;background:var(--surface)}
.hero::before{content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:80vw;height:80vw;background:radial-gradient(circle,var(--primary-light) 0%,transparent 60%);z-index:0;opacity:.8}
.hero .container{position:relative;z-index:1}
.hero-badge{display:inline-flex;padding:.5rem 1.2rem;background:var(--bg);border:1px solid var(--border);border-radius:999px;font-size:.85rem;font-weight:800;color:var(--primary);margin-bottom:2rem;box-shadow:var(--shadow-sm);backdrop-filter:blur(10px)}
.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);margin-bottom:1.5rem;line-height:1.15;letter-spacing:-.04em}
.hero h1 em{font-style:normal;color:var(--primary);position:relative;display:inline-block}
.hero h1 em::after{content:'';position:absolute;bottom:8px;left:0;width:100%;height:12px;background:var(--primary-light);z-index:-1;border-radius:6px}
.hero p{font-size:clamp(1.1rem,2vw,1.25rem);color:var(--muted);margin-bottom:3rem;max-width:650px;margin-inline:auto;font-weight:500;line-height:1.8}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════════
   §5 CARDS
   ═══════════════════════════════════════════════════════════════ */
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:all .5s var(--ease);display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}

/* Course Card */
.course-thumb{aspect-ratio:16/9;position:relative;background:#000;overflow:hidden}
.course-thumb video{width:100%;height:100%;object-fit:cover;opacity:.85;transition:transform .5s var(--ease)}
.card:hover .course-thumb video{transform:scale(1.05)}
.course-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--primary);display:grid;place-items:center;cursor:pointer;border:none;transition:all 0.3s;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.course-play-btn:hover{transform:translate(-50%,-50%) scale(1.1);background:#fff}
.course-num{position:absolute;top:1rem;right:1rem;background:var(--primary);color:#fff;padding:.3rem .8rem;border-radius:999px;font-size:.75rem;font-weight:800;box-shadow:var(--shadow-sm)}
[dir="rtl"] .course-num{right:auto;left:1rem}
.course-info{padding:1.5rem;display:flex;flex-direction:column;gap:.8rem;flex:1;text-align:center}
.course-info h3{font-size:1.1rem;font-weight:800;color:var(--text)}

/* Products */
.product-img{aspect-ratio:4/5;background-size:cover;background-position:center;position:relative;transition:transform .5s var(--ease)}
.card:hover .product-img{transform:scale(1.05)}
.product-info{padding:1.5rem;display:flex;flex-direction:column;gap:.4rem;flex:1;background:var(--surface);position:relative;z-index:2}
.product-info h3{font-size:1.1rem;font-weight:800;margin-bottom:.2rem}
.product-info .brand-name-small{color:var(--primary);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge-new{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);color:var(--primary);padding:.3rem .8rem;border-radius:999px;font-size:.75rem;font-weight:900;z-index:2;box-shadow:var(--shadow-sm)}
[dir="rtl"] .badge-new{right:auto;left:1rem}

/* Lifestyle */
.life-img{aspect-ratio:4/3;background-size:cover;background-position:center}
.life-info{padding:1.5rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.life-info h3{font-size:1.1rem;font-weight:800}
.life-info p{color:var(--muted);font-size:.9rem;flex:1;line-height:1.7}
.life-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.life-tag{background:var(--bg);color:var(--text);font-size:.75rem;font-weight:700;padding:.2rem .7rem;border-radius:999px;border:1px solid var(--border)}

/* ═══════════════════════════════════════════════════════════════
   §6 REELS PAGE
   ═══════════════════════════════════════════════════════════════ */
body.reels-mode{overflow:hidden;padding-bottom:0}
body.reels-mode .site-header,body.reels-mode .bottom-nav,body.reels-mode .site-footer{display:none!important}
.reels-page{position:fixed;inset:0;z-index:150;background:#000;overflow:hidden}
.reels-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:1.2rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);color:#fff}
.reels-top button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;font-size:1.2rem;transition:background .3s}
.reels-top button:hover{background:rgba(255,255,255,.3)}
.reels-title{font-size:1.2rem;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.reels-feed{width:100%;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-feed::-webkit-scrollbar{display:none}
.reel-item{width:100%;height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.reel-item video{width:100%;height:100%;object-fit:cover}
.reel-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 40%,transparent 70%,rgba(0,0,0,.4) 100%);pointer-events:none}
.reel-side-actions{position:absolute;right:1rem;bottom:6rem;z-index:5;display:flex;flex-direction:column;gap:1.5rem;align-items:center}
[dir="rtl"] .reel-side-actions{right:auto;left:1rem}
.reel-action{display:flex;flex-direction:column;align-items:center;gap:.3rem;color:#fff;font-size:.75rem;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.8);transition:transform .3s;cursor:pointer;}
.reel-action:active{transform:scale(.9)}
.reel-action .icon{font-size:2rem;line-height:1;transition:color .3s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.reel-action.liked .icon{color:#ff2d55}
.reel-info{position:absolute;left:1rem;right:5rem;bottom:2rem;z-index:5;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
[dir="rtl"] .reel-info{left:5rem;right:1rem}
.reel-info h3{font-size:1.1rem;margin-bottom:.4rem;font-weight:900}
.reel-info p{font-size:.9rem;opacity:.9;font-weight:500}

/* ═══════════════════════════════════════════════════════════════
   §7 MODAL & TOAST & ADMIN
   ═══════════════════════════════════════════════════════════════ */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px)}
.modal-box{position:relative;background:var(--surface);border-radius:var(--radius);width:100%;max-width:600px;overflow:hidden;box-shadow:var(--shadow-lg);z-index:1;animation:zoomIn .3s var(--ease)}
@keyframes zoomIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:1rem;right:1rem;z-index:10;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;border:none;cursor:pointer;backdrop-filter:blur(5px);transition:background .3s}
.modal-close:hover{background:rgba(0,0,0,.8)}
.modal-video{aspect-ratio:16/9;background:#000}
.modal-video video{width:100%;height:100%;object-fit:contain}
.modal-info{padding:2rem}
.modal-info h3{font-size:1.4rem;margin-bottom:.5rem}
.modal-info p{color:var(--muted);font-size:1rem;margin-bottom:1.5rem}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:1rem 2rem;border-radius:999px;font-size:.9rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:all .4s var(--ease);z-index:300;max-width:calc(100vw - 2rem);text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.success{background:#10B981;color:#fff}
.toast.error{background:#EF4444;color:#fff}

.admin-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:calc(var(--header-h) + 2rem) 1rem 3rem;background:var(--bg)}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;width:100%;max-width:550px;box-shadow:var(--shadow-lg)}
.admin-card h2{text-align:center;color:var(--text);margin-bottom:2rem;font-size:1.8rem}
.form-group{margin-bottom:1.5rem}
.form-group label{display:block;font-size:.9rem;font-weight:800;margin-bottom:.5rem;color:var(--text)}
.form-input,.form-textarea{width:100%;padding:1rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.95rem;transition:all .3s;font-weight:500}
.form-textarea{min-height:100px;resize:vertical}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.hint{font-size:.8rem;color:var(--muted);margin-top:.5rem;font-weight:500}
.admin-status{text-align:center;font-size:.9rem;margin-top:1rem;font-weight:700;min-height:1.5rem}
.tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:var(--bg);padding:.4rem;border-radius:var(--radius-sm);border:1px solid var(--border)}
.tab-btn{flex:1;padding:.8rem .5rem;text-align:center;font-weight:800;font-size:.9rem;border-radius:8px;color:var(--muted);transition:all .3s;cursor:pointer;border:none;background:none;}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn .4s ease}
.test-btn{background:var(--primary-light);color:var(--primary);border:1px solid rgba(212,105,134,.2);padding:.6rem 1.2rem;border-radius:999px;font-size:.85rem;font-weight:800;margin-bottom:1.5rem;cursor:pointer;width:100%;transition:all .3s}
.test-btn:hover{background:var(--primary);color:#fff}

.site-footer{background:var(--surface);border-top:1px solid var(--border);padding:4rem 0 2rem;margin-top:4rem;text-align:center}
.footer-content{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.footer-content p{color:var(--muted);font-size:.95rem;font-weight:500}
.social-links{display:flex;gap:1.5rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
.social-links a{color:var(--text);font-weight:800;font-size:.95rem;transition:color .3s}
.social-links a:hover{color:var(--primary)}

.empty-box{text-align:center;padding:4rem 2rem;background:var(--surface);border-radius:var(--radius);grid-column:1/-1;border:1px dashed var(--border)}
.empty-box h3{color:var(--muted);font-weight:700;font-size:1.1rem}
.loading-box{text-align:center;padding:4rem;grid-column:1/-1;color:var(--muted)}
.spinner{display:inline-block;width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .hero{padding-top:calc(var(--header-h) + 4rem);padding-bottom:5rem}
  .section{padding:3rem 0}
  .grid-4,.grid-3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
  .admin-card{padding:1.5rem}
}
</style>
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="site-header">
  <div class="container nav-wrap">
    <a href="#/home" class="brand">
      <div class="logo-holder"><img src="image/logo.jpg" alt="Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' rx=\'16\' fill=\'%23D46986\'/%3E%3Ctext x=\'32\' y=\'42\' text-anchor=\'middle\' font-family=\'sans-serif\' font-size=\'24\' fill=\'white\'%3EDF%3C/text%3E%3C/svg%3E'"></div>
      <span class="brand-name">Daily <em>Fashion</em></span>
    </a>
    <nav class="desktop-nav">
      <a href="#/home" data-nav="home" data-i18n="nav.home">خانه</a>
      <a href="#/course" data-nav="course" data-i18n="nav.course">دوره‌ها</a>
      <a href="#/reels" data-nav="reels" data-i18n="nav.reels">ریلز</a>
      <a href="#/about" data-nav="about" data-i18n="nav.about">درباره</a>
      <a href="#/contact" data-nav="contact" data-i18n="nav.contact">تماس</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <div class="lang-switch">
        <button data-lang="fa" class="active">FA</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- ═══════════════════ BOTTOM NAV ═══════════════════ -->
<nav class="bottom-nav">
  <a href="#/home" data-nav="home">
    <span class="icon-box"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
    <span data-i18n="nav.home">خانه</span>

}

/* ═══════════════════════════════════════════════════════════════
   §6 GITHUB API (دریافت و آپلود فایل)
   ═══════════════════════════════════════════════════════════════ */
async function fetchFolder(folder, sortDesc = false) {
  try {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${folder}?t=${Date.now()}`, {
      headers: { Authorization: `Bearer ${CONFIG.GH_TOKEN}` }
    });
    if (res.status === 404) return [];
    if (!res.ok) throw new Error('GitHub API Error: ' + res.status);
    
    const files = await res.json();
    if (!Array.isArray(files)) return [];
    
    const items = files
      .filter(f => f.type === 'file' && /\.(mp4|webm|mov)$/i.test(f.name))
      .map(f => ({ name: f.name, url: f.download_url }));
      
    return items.sort((a, b) => {
      const numA = parseInt(a.name.match(/\d+/)) || 0;
      const numB = parseInt(b.name.match(/\d+/)) || 0;
      return sortDesc ? numB - numA : numA - numB;
    });
  } catch(e) {
    console.error('fetchFolder error:', e);
    return [];
  }
}

async function fetchPosts() {
  try {
    // استفاده از API به جای raw برای پشتیبانی از ریپازیتوری خصوصی
    const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${CONFIG.POSTS_FILE}?t=${Date.now()}`, {
      headers: { Authorization: `Bearer ${CONFIG.GH_TOKEN}` }
    });
    if (!res.ok) return [];
    const data = await res.json();
    // گیت‌هاب محتوا را به صورت Base64 برمی‌گرداند
    const content = atob(data.content.replace(/\s/g, ''));
    return JSON.parse(content);
  } catch { return []; }
}

async function ghPutFile(path, content, message) {
  let sha = null;
  try {
    const r = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`, {
      headers: { Authorization: `Bearer ${CONFIG.GH_TOKEN}` }
    });
    if (r.ok) { const d = await r.json(); sha = d.sha; }
  } catch {}

  const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: {
      Authorization: `Bearer ${CONFIG.GH_TOKEN}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github.v3+json'
    },
    body: JSON.stringify({ message, content, sha: sha || undefined })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (res.status === 401) throw new Error('توکن گیت‌هاب نامعتبر است.');
    if (res.status === 403) throw new Error('دسترسی نوشتن در گیت‌هاب مسدود است.');
    throw new Error(err.message || ('HTTP ' + res.status));
  }
  return res.json();
}

function getLikedState(id) { return !!JSON.parse(localStorage.getItem('df-liked') || '{}')[id]; }
function setLikedState(id, liked) {
  const likes = JSON.parse(localStorage.getItem('df-liked') || '{}');
  if (liked) likes[id] = true; else delete likes[id];
  localStorage.setItem('df-liked', JSON.stringify(likes));
}
function getLikeCount(id) { return JSON.parse(localStorage.getItem('df-like-counts') || '{}')[id] || 0; }
function setLikeCount(id, count) {
  const counts = JSON.parse(localStorage.getItem('df-like-counts') || '{}');
  counts[id] = Math.max(0, count);
  localStorage.setItem('df-like-counts', JSON.stringify(counts));
}
function toggleLike(id) {
  const wasLiked = getLikedState(id);
  let count = getLikeCount(id);
  if (wasLiked) { count = Math.max(0, count - 1); setLikedState(id, false); }
  else { count = count + 1; setLikedState(id, true); }
  setLikeCount(id, count);
  return { liked: !wasLiked, count };
}

async function downloadVideo(url, filename) {
  showToast(t('toast.loading'));
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    showToast(t('toast.downloaded'));
  } catch {
    showToast(t('toast.error'), 'error');
    window.open(url, '_blank');
  }
}

  catch { showToast(t('toast.shareFail'), 'error'); }
}

function lifestyleCard(l) {
  return `<div class="card fade-in">
    <div style="overflow:hidden"><div class="life-img" style="background-image:url('${l.img}')"></div></div>
    <div class="life-info">
      <h3>${l.title[state.lang]}</h3>
      <p>${l.desc[state.lang]}</p>
      <div class="life-tags">${l.tags[state.lang].map(tag => `<span class="life-tag">${tag}</span>`).join('')}</div>
    </div>
  </div>`;
}

function postCard(p) {
  return `<div class="card fade-in">
    <div style="overflow:hidden"><div class="life-img" style="background-image:url('${p.image_url || 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=600&q=80'}')"></div></div>
    <div class="life-info">
      <h3>${p['title_' + state.lang] || p.title_fa || ''}</h3>
      <p>${p['desc_' + state.lang] || p.desc_fa || ''}</p>
    </div>
  </div>`;
}

function courseCard(v) {
  const match = v.name.match(/\d+/); 
  const num = match ? parseInt(match[0]) : null;
  
  let title = v.name;
  if (num) {
      if (state.lang === 'fa') {
          title = `دوره ${getPersianOrdinal(num)}`;
      } else {
          const enOrdinals = {1:"First", 2:"Second", 3:"Third", 4:"Fourth", 5:"Fifth", 6:"Sixth", 7:"Seventh", 8:"Eighth", 9:"Ninth", 10:"Tenth"};
          title = `${enOrdinals[num] || num} Course`;
      }
  }

  return `<div class="card fade-in">
    <div class="course-thumb">
      <video src="${v.url}#t=0.5" muted preload="metadata" playsinline></video>
      <button onclick="openVideoModal('${v.url}','${title}')" class="course-play-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.3-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14Z"/></svg>
      </button>
      <span class="course-num">${title}</span>
    </div>
    <div class="course-info">
      <h3>${title}</h3>
      <button class="btn btn-primary btn-sm btn-block" onclick="downloadVideo('${v.url}','${v.name}')">${t('btn.download')}</button>
    </div>
  </div>`;
}

function emptyBox(msg) { return `<div class="empty-box fade-in"><h3>${msg}</h3></div>`; }
function loadingBox() { return `<div class="loading-box"><div class="spinner"></div></div>`; }

window.openVideoModal = function(url, name) {
  state.modal = { url, name };
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalDesc').textContent = 'Daily Fashion Premium';
  document.getElementById('modalVideo').innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
  document.getElementById('modalDownloadBtn').onclick = () => downloadVideo(url, name);
  document.getElementById('videoModal').classList.add('open');
};

document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => {
  document.getElementById('videoModal').classList.remove('open');
  document.getElementById('modalVideo').innerHTML = '';
}));

window.handleLike = function(name, btn) {
  const result = toggleLike(name);
  btn.querySelector('.icon').textContent = result.liked ? '❤️' : '🤍';
  btn.querySelector('.count').textContent = result.count;
  btn.classList.toggle('liked', result.liked);
};

window.handleShare = function(name) {
  const reel = state.reels.find(r => r.name === name);
  if (reel) shareReel(reel);
};

/* ═══════════════════════════════════════════════════════════════
   §12 ADMIN LOGIC
   ═══════════════════════════════════════════════════════════════ */
window.loginAdmin = function() {
  const pass = document.getElementById('adminPass').value;
  if (pass === CONFIG.ADMIN_PASS) { sessionStorage.setItem('df-admin-auth', 'true'); pages.admin(); }
  else alert(t('toast.wrongPass'));
};
window.logoutAdmin = function() { sessionStorage.removeItem('df-admin-auth'); pages.admin(); };

window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));
};

window.testConnection = async function() {
  try {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}`, {
      headers: { Authorization: `Bearer ${CONFIG.GH_TOKEN}` }
    });
    if (res.ok) showToast(t('toast.tokenOk'));
    else showToast(t('toast.tokenFail') + ' (HTTP ' + res.status + ')', 'error');
  } catch(e) {
    showToast(t('toast.tokenFail') + ': ' + e.message, 'error');
  }
};

window.uploadCourse = async function() {
  const num = document.getElementById('courseNum').value;
  const file = document.getElementById('courseFile').files[0];
  const btn = document.getElementById('courseBtn');
  const status = document.getElementById('courseStatus');

  if (!num || !file) { status.textContent = t('toast.fill'); status.style.color = 'red'; return; }
  if (file.size > 25 * 1024 * 1024) { status.textContent = t('toast.tooBig'); status.style.color = 'red'; return; }

  btn.disabled = true; btn.textContent = t('toast.loading');
  status.textContent = t('toast.loading'); status.style.color = 'var(--primary)';

  try {
    const b64 = await fileToBase64(file);
    const path = `${CONFIG.FOLDERS.course}/${num}.mp4`;
    await ghPutFile(path, b64, `Upload course ${num}`);
    status.textContent = t('toast.uploaded'); status.style.color = 'green';
    document.getElementById('courseNum').value = '';
    document.getElementById('courseFile').value = '';
    await loadAll();
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.style.color = 'red';
  } finally {
    btn.disabled = false; btn.textContent = t('admin.upload');
  }
};

window.uploadReel = async function() {
  const file = document.getElementById('reelFile').files[0];
  const btn = document.getElementById('reelBtn');
  const status = document.getElementById('reelStatus');

  if (!file) { status.textContent = t('toast.fill'); status.style.color = 'red'; return; }
  if (file.size > 25 * 1024 * 1024) { status.textContent = t('toast.tooBig'); status.style.color = 'red'; return; }

  btn.disabled = true; btn.textContent = t('toast.loading');
  status.textContent = t('toast.loading'); status.style.color = 'var(--primary)';

  try {
    const b64 = await fileToBase64(file);
    const fileName = `reel-${Date.now()}.mp4`;
    const path = `${CONFIG.FOLDERS.reels}/${fileName}`;
    await ghPutFile(path, b64, `Upload reel ${fileName}`);
    status.textContent = t('toast.uploaded'); status.style.color = 'green';
    document.getElementById('reelFile').value = '';
    await loadAll();
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.style.color = 'red';
  } finally {
    btn.disabled = false; btn.textContent = t('admin.upload');
  }
};

window.uploadPost = async function() {
  const titleFa = document.getElementById('postTitleFa').value;
  const titleEn = document.getElementById('postTitleEn').value;
  const descFa = document.getElementById('postDescFa').value;
  const descEn = document.getElementById('postDescEn').value;
  const img = document.getElementById('postImg').value;
  const btn = document.getElementById('postBtn');
  const status = document.getElementById('postStatus');

  if (!titleFa || !titleEn) { status.textContent = t('toast.fill'); status.style.color = 'red'; return; }

  btn.disabled = true; btn.textContent = t('toast.loading');
  status.textContent = t('toast.loading'); status.style.color = 'var(--primary)';

  try {
    const currentPosts = await fetchPosts();
    const newPost = { id: Date.now(), title_fa: titleFa, title_en: titleEn, desc_fa: descFa, desc_en: descEn, image_url: img };
    currentPosts.unshift(newPost);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentPosts, null, 2))));
    await ghPutFile(CONFIG.POSTS_FILE, content, `Add post: ${titleEn}`);
    status.textContent = t('toast.uploaded'); status.style.color = 'green';
    ['postTitleFa','postTitleEn','postDescFa','postDescEn','postImg'].forEach(id => document.getElementById(id).value = '');
    await loadAll();
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.style.color = 'red';
  } finally {
    btn.disabled = false; btn.textContent = t('admin.post.save');
  }
};

/* ═══════════════════════════════════════════════════════════════
   §13 ROUTER & INIT
   ═══════════════════════════════════════════════════════════════ */
function router() {
  const hash = window.location.hash.replace('#/', '') || 'home';
  const route = hash.split('/')[0];
  state.route = route;
  document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === route));

  if (route === 'reels') pages.reels();
  else if (route === 'course') pages.course();
  else if (route === 'about') pages.about();
  else if (route === 'contact') pages.contact();
  else if (route === 'admin') pages.admin();
  else pages.home();

  if (route !== 'reels') window.scrollTo(0, 0);
}

document.querySelectorAll('.lang-switch button').forEach(btn => btn.addEventListener('click', () => {
  state.lang = btn.dataset.lang;
  updateLanguage();
  router();
}));
window.addEventListener('hashchange', router);

(async function init() {
  initTheme();
  updateLanguage();
  await loadAll();
})();
</script>
