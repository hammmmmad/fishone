<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D46986">
<title>Daily Fashion AF</title>
<link rel="icon" href="image/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
(function(){
  document.documentElement.setAttribute('data-theme', localStorage.getItem('df-theme') || 'light');
  var l = localStorage.getItem('df-lang') || 'fa';
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   §1 TOKENS & RESET
   ═══════════════════════════════════════════════════════════════ */
:root{
  --primary:#D46986; --primary-dark:#A9425D; --primary-light:#FDF2F5;
  --bg:#FCFBF9; --surface:#FFFFFF; --text:#2B282C; --muted:#7A757B;
  --border:#F0E6E9; --shadow-sm:0 4px 12px rgba(212,105,134,.06);
  --shadow-lg:0 24px 48px -12px rgba(212,105,134,.18);
  --radius:24px; --radius-sm:14px; --header-h:72px; --nav-h:70px;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#141416; --surface:#1E1E22; --text:#F5F5F5; --muted:#A0A0A5;
  --border:#2D2B30; --primary-light:#2A1B20;
  --shadow-sm:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;transition:background-color .4s var(--ease),color .4s var(--ease);padding-bottom:var(--nav-h)}
@media(min-width:900px){body{padding-bottom:0}}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-weight:800;line-height:1.3}
[lang="en"] h1,[lang="en"] h2,[lang="en"] h3,[lang="en"] .brand-name{font-family:'Playfair Display',serif}
.container{width:min(100% - 2rem,1200px);margin-inline:auto}

/* ═══════════════════════════════════════════════════════════════
   §2 HEADER & NAV
   ═══════════════════════════════════════════════════════════════ */
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-h);background:rgba(252,251,249,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
[data-theme="dark"] .site-header{background:rgba(20,20,22,.85)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.brand{display:flex;align-items:center;gap:.75rem}
.logo-holder{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);box-shadow:var(--shadow-sm);transition:transform .4s var(--ease)}
.brand:hover .logo-holder{transform:scale(1.05) rotate(5deg)}
.logo-holder img{width:100%;height:100%;object-fit:cover}
.brand-name{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.brand-name em{font-style:normal;color:var(--primary)}
.desktop-nav{display:none;gap:.5rem;background:var(--surface);padding:.35rem;border-radius:999px;border:1px solid var(--border)}
@media(min-width:900px){.desktop-nav{display:flex}}
.desktop-nav a{padding:.6rem 1.2rem;border-radius:999px;font-size:.9rem;font-weight:600;color:var(--muted);transition:all .3s}
.desktop-nav a:hover,.desktop-nav a.active{background:var(--primary-light);color:var(--primary)}
.nav-actions{display:flex;align-items:center;gap:.5rem}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text);transition:all .3s}
.icon-btn:hover{background:var(--primary-light);color:var(--primary)}
.icon-btn svg{width:20px;height:20px}
.lang-switch{display:flex;background:var(--surface);border-radius:999px;padding:.25rem;border:1px solid var(--border)}
.lang-switch button{padding:.3rem .8rem;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--muted);transition:.3s}
.lang-switch button.active{background:var(--primary);color:#fff}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
[data-theme="dark"] .bottom-nav{background:rgba(30,30,34,.95)}
@media(min-width:900px){.bottom-nav{display:none}}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;color:var(--muted);font-size:.68rem;font-weight:600;transition:all .3s;flex:1;height:100%;position:relative}
.bottom-nav a .icon-box{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.bottom-nav a svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav a.active::before{content:'';position:absolute;top:0;width:30%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}

/* ═══════════════════════════════════════════════════════════════
   §3 GENERAL UI
   ═══════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem 1.8rem;border-radius:999px;font-weight:700;font-size:.95rem;transition:all .3s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
.btn-sm{padding:.6rem 1.2rem;font-size:.85rem}
.btn-block{width:100%}

.section{padding:4rem 0}
.section-header{text-align:center;margin-bottom:2.5rem}
.section-header h2{font-size:clamp(1.7rem,4vw,2.3rem);margin-bottom:.5rem}
.section-header p{color:var(--muted);font-size:1rem}
.view-all-link{display:inline-flex;align-items:center;gap:.4rem;margin-top:.75rem;color:var(--primary);font-weight:700;font-size:.9rem}

.hero{position:relative;padding-top:calc(var(--header-h) + 4rem);padding-bottom:5rem;text-align:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1920&q=80') center/cover;opacity:.08;z-index:-1}
.hero-badge{display:inline-flex;padding:.4rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:1.5rem;box-shadow:var(--shadow-sm)}
.hero h1{font-size:clamp(2rem,5.5vw,3.8rem);margin-bottom:1.2rem;line-height:1.2}
.hero p{font-size:clamp(1rem,2vw,1.1rem);color:var(--muted);margin-bottom:2.5rem;max-width:600px;margin-inline:auto}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:all .4s var(--ease);display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}

/* ═══════════════════════════════════════════════════════════════
   §4 CARDS
   ═══════════════════════════════════════════════════════════════ */
.product-img{aspect-ratio:1;background-size:cover;background-position:center;position:relative}
.product-info{padding:1.1rem}
.product-info h3{font-size:1rem;margin-bottom:.25rem}
.product-info .brand{color:var(--muted);font-size:.82rem}
.badge-new{position:absolute;top:.8rem;right:.8rem;background:var(--primary);color:#fff;padding:.2rem .6rem;border-radius:999px;font-size:.68rem;font-weight:800}
[dir="rtl"] .badge-new{right:auto;left:.8rem}

.life-img{aspect-ratio:4/3;background-size:cover;background-position:center}
.life-info{padding:1.1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.life-info h3{font-size:1.02rem}
.life-info p{color:var(--muted);font-size:.83rem;flex:1;line-height:1.7}
.life-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
.life-tag{background:var(--primary-light);color:var(--primary);font-size:.68rem;font-weight:700;padding:.15rem .55rem;border-radius:999px}

.post-img{aspect-ratio:16/10;background-size:cover;background-position:center}
.post-info{padding:1.1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.post-info h3{font-size:1.02rem}
.post-info p{color:var(--muted);font-size:.83rem;flex:1;line-height:1.75}

.reel-preview{position:relative;aspect-ratio:9/16;border-radius:var(--radius);overflow:hidden;background:#222;cursor:pointer}
.reel-preview video{width:100%;height:100%;object-fit:cover;opacity:.85}
.reel-preview .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:1.1rem;color:#fff}
.reel-preview .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--primary)}
.reel-preview h3{font-size:.95rem;margin-bottom:.2rem}
.reel-preview p{font-size:.78rem;opacity:.9}

/* ═══════════════════════════════════════════════════════════════
   §5 REELS PAGE (TikTok Style)
   ═══════════════════════════════════════════════════════════════ */
body.reels-mode{overflow:hidden;padding-bottom:0}
body.reels-mode .site-header,body.reels-mode .bottom-nav,body.reels-mode .site-footer{display:none!important}
.reels-page{position:fixed;inset:0;z-index:150;background:#000;overflow:hidden}
.reels-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);color:#fff}
.reels-top button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.reels-title{font-size:1.1rem;font-weight:800}
.reels-feed{width:100%;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-feed::-webkit-scrollbar{display:none}
.reel-item{width:100%;height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.reel-item video{width:100%;height:100%;object-fit:cover}
.reel-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 45%,transparent 75%,rgba(0,0,0,.3) 100%);pointer-events:none}
.reel-side-actions{position:absolute;right:.8rem;bottom:5.5rem;z-index:5;display:flex;flex-direction:column;gap:1.3rem;align-items:center}
[dir="rtl"] .reel-side-actions{right:auto;left:.8rem}
.reel-action{display:flex;flex-direction:column;align-items:center;gap:.25rem;color:#fff;font-size:.68rem;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.6);transition:transform .3s}
.reel-action:active{transform:scale(.9)}
.reel-action .icon{font-size:1.9rem;line-height:1;transition:color .3s}
.reel-action.liked .icon{color:#ff2d55}
.reel-info{position:absolute;left:1rem;right:5rem;bottom:1.5rem;z-index:5;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}
[dir="rtl"] .reel-info{left:5rem;right:1rem}
.reel-info h3{font-size:1rem;margin-bottom:.3rem;font-weight:800}
.reel-info p{font-size:.82rem;opacity:.92;margin-bottom:.5rem}
.reel-number{display:inline-flex;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:.2rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700}

/* ═══════════════════════════════════════════════════════════════
   §6 MODAL & ADMIN
   ═══════════════════════════════════════════════════════════════ */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px)}
.modal-box{position:relative;background:var(--surface);border-radius:var(--radius);width:100%;max-width:500px;overflow:hidden;box-shadow:var(--shadow-lg);z-index:1}
.modal-close{position:absolute;top:1rem;right:1rem;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.modal-video{aspect-ratio:16/9;background:#000}
.modal-video video{width:100%;height:100%;object-fit:contain}
.modal-info{padding:1.5rem}
.modal-info h3{font-size:1.3rem;margin-bottom:.5rem}
.modal-info p{color:var(--muted);font-size:.95rem;margin-bottom:1.5rem}

.admin-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:calc(var(--header-h) + 2rem) 1rem 2rem}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;width:100%;max-width:520px;box-shadow:var(--shadow-lg)}
.admin-card h2{text-align:center;color:var(--primary);margin-bottom:1.5rem}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:.88rem;font-weight:700;margin-bottom:.4rem}
.form-input,.form-textarea{width:100%;padding:.85rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.95rem;transition:border-color .3s}
.form-textarea{min-height:80px;resize:vertical}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.admin-status{text-align:center;font-size:.85rem;margin-top:.8rem;font-weight:600;min-height:1.2rem}
.tabs{display:flex;gap:.3rem;margin-bottom:1.3rem;background:var(--bg);padding:.3rem;border-radius:var(--radius-sm)}
.tab-btn{flex:1;padding:.65rem .3rem;text-align:center;font-weight:700;font-size:.82rem;border-radius:8px;color:var(--muted);transition:all .3s}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.tab-panel{display:none}
.tab-panel.active{display:block}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#2B282C;color:#fff;padding:.75rem 1.4rem;border-radius:999px;font-size:.88rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:all .3s;z-index:300;max-width:calc(100vw - 2rem);text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.success{background:#1eb955}
.toast.error{background:#e74c3c}

.site-footer{background:var(--surface);border-top:1px solid var(--border);padding:3rem 0 1.5rem;margin-top:3rem;text-align:center}
.footer-content{display:flex;flex-direction:column;align-items:center;gap:1rem}
.footer-content p{color:var(--muted);font-size:.9rem}
.social-links{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
.social-links a{color:var(--primary);font-weight:700;font-size:.9rem}

.empty-box{text-align:center;padding:3rem;background:var(--surface);border-radius:var(--radius);grid-column:1/-1}
.empty-box h3{color:var(--muted);font-weight:600}
.loading-box{text-align:center;padding:3rem;grid-column:1/-1;color:var(--muted)}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .hero{padding-top:calc(var(--header-h) + 3rem);padding-bottom:3.5rem}
  .section{padding:2.5rem 0}
  .section-header{margin-bottom:1.8rem}
  .grid-4,.grid-3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
  .admin-card{padding:1.5rem}
}
</style>
</head>

/* ═══════════════════════════════════════════════════════════════
   §6 GITHUB API
   ═══════════════════════════════════════════════════════════════ */
async function fetchFolder(folder) {
  try {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${folder}?t=${Date.now()}`, {
      headers: { Authorization: `Bearer ${CONFIG.GH_TOKEN}` }
    });
    if (res.status === 404) return [];
    if (!res.ok) throw new Error('GitHub API error');
    const files = await res.json();
    if (!Array.isArray(files)) return [];
    return files
      .filter(f => f.type === 'file' && /\.(mp4|webm|mov)$/i.test(f.name))
      .map(f => {
        const num = parseInt((f.name.match(/(\d+)/) || ['0'])[0]) || 0;
        return { num, url: f.download_url, name: f.name };
      })
      .filter(v => v.num > 0)
      .sort((a, b) => a.num - b.num);
  } catch(e) { return []; }
}

async function fetchPosts() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/main/${CONFIG.POSTS_FILE}?t=${Date.now()}`);
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}

async function loadAll() {

  state.posts = await fetchPosts();

  router();
}

async function ghPutFile(path, content, token, message) {
  let sha = null;
  try {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.ok) { const d = await res.json(); sha = d.sha; }
  } catch {}
  const res = await fetch(`https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
    body: JSON.stringify({ message, content, sha: sha || undefined })
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.message || 'Upload failed'); }
  return res.json();
}

/* ═══════════════════════════════════════════════════════════════
   §7 LIKES & SHARE & DOWNLOAD
   ═══════════════════════════════════════════════════════════════ */
function getLikedState(num) {
  const likes = JSON.parse(localStorage.getItem('df-liked') || '{}');
  return !!likes[num];
}
function setLikedState(num, liked) {
  const likes = JSON.parse(localStorage.getItem('df-liked') || '{}');
  if (liked) likes[num] = true; else delete likes[num];
  localStorage.setItem('df-liked', JSON.stringify(likes));
}
function getLikeCount(num) {
  const counts = JSON.parse(localStorage.getItem('df-like-counts') || '{}');
  return counts[num] || 0;
}
function setLikeCount(num, count) {
  const counts = JSON.parse(localStorage.getItem('df-like-counts') || '{}');
  counts[num] = Math.max(0, count);
  localStorage.setItem('df-like-counts', JSON.stringify(counts));
}
function toggleLike(num) {
  const currentlyLiked = getLikedState(num);
  let count = getLikeCount(num);
  if (currentlyLiked) { count = Math.max(0, count - 1); setLikedState(num, false); }
  else { count = count + 1; setLikedState(num, true); }
  setLikeCount(num, count);
  return { liked: !currentlyLiked, count };
}

async function downloadVideo(url, filename) {
  showToast(t('toast.loading'));
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    showToast(t('toast.downloaded'));
  } catch {
    showToast(t('toast.error'), 'error');
    window.open(url, '_blank');
  }
}

async function shareReel(reel) {
  const data = {
    title: `Daily Fashion - ${reel.num}`,
    text: state.lang === 'fa' ? 'این ریل را در دیلی فشن ببینید!' : 'Watch this reel on Daily Fashion!',
    url: window.location.origin + window.location.pathname + `#/reels/${reel.num}`
  };
  if (navigator.share) {
    try { await navigator.share(data); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(data.url);
    showToast(t('toast.copied'));
  } catch { showToast(t('toast.shareFail'), 'error'); }
}

          <div class="grid-4">${reelsHTML}</div>
        </div>
      </section>
      
      <section class="section" style="background:var(--primary-light)">
        <div class="container">
          <div class="section-header"><h2>${t('sec.products')}</h2><p>${t('sec.products.sub')}</p></div>
          <div class="grid-4">${productsHTML}</div>
        </div>
      </section>
      
      <section class="section">
        <div class="container">
          <div class="section-header"><h2>${t('sec.lifestyle')}</h2><p>${t('sec.lifestyle.sub')}</p></div>
          <div class="grid-4">${lifestyleHTML}</div>
        </div>
      </section>
      
      <section class="section" style="background:var(--primary-light)">
        <div class="container">
          <div class="section-header"><h2>${t('sec.posts')}</h2><p>${t('sec.posts.sub')}</p></div>
          <div class="grid-4">${postsHTML}</div>
        </div>
      </section>
    `;
  },

  reels() {
    document.body.classList.add('reels-mode');
    const hash = window.location.hash;
    const match = hash.match(/#\/reels\/(\d+)/);
    const startNum = match ? parseInt(match[1]) : null;
    
    if (state.loading.reels) {
      app.innerHTML = `<div class="reels-page" style="display:grid;place-items:center"><div class="spinner" style="border-top-color:#fff"></div></div>`;
      return;
    }
    if (state.reels.length === 0) {
      app.innerHTML = `<div class="reels-page" style="display:grid;place-items:center;color:#fff;text-align:center;padding:2rem"><h2>${t('reels.empty')}</h2><button class="btn btn-primary" style="margin-top:1rem" onclick="location.hash='#/home'">${t('nav.home')}</button></div>`;
      return;
    }
    
    const reelsHTML = state.reels.map(r => {
      const liked = getLikedState(r.num);
      const count = getLikeCount(r.num);
      return `<div class="reel-item" data-num="${r.num}">
        <video src="${r.url}" loop muted playsinline preload="none"></video>
        <div class="reel-gradient"></div>
        <div class="reel-side-actions">
          <button class="reel-action like-btn ${liked ? 'liked' : ''}" data-num="${r.num}" onclick="handleLike(${r.num}, this)">
            <span class="icon">${liked ? '❤️' : '🤍'}</span>
            <span class="count">${count}</span>
          </button>
          <button class="reel-action" onclick="handleShare(${r.num})">
            <span class="icon">↗</span>
            <span>${t('reels.share')}</span>
          </button>
          <button class="reel-action" onclick="downloadVideo('${r.url}','reel-${r.num}.mp4')">
            <span class="icon">⬇</span>
            <span>${t('reels.download')}</span>
          </button>
        </div>
        <div class="reel-info">
          <span class="reel-number">${state.lang === 'fa' ? 'دوره ' : 'Course '}${r.num}</span>
          <h3 style="margin-top:.5rem">Daily Fashion AF</h3>
          <p>${state.lang === 'fa' ? 'آموزش گام به گام' : 'Step-by-step tutorial'}</p>
        </div>
      </div>`;
    }).join('');
    
    app.innerHTML = `<div class="reels-page">
      <div class="reels-top">
        <button onclick="location.hash='#/home'">←</button>
        <span class="reels-title">${t('nav.reels')}</span>
        <button id="soundToggle">🔇</button>
      </div>
      <div class="reels-feed" id="reelsFeed">${reelsHTML}</div>
    </div>`;
    
    if (state.reelObserver) state.reelObserver.disconnect();
    state.reelObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (!video) return;
        if (entry.isIntersecting) { video.preload = 'auto'; video.play().catch(() => {}); }
        else { video.pause(); }
      });
    }, { threshold: 0.6 });
    
    document.querySelectorAll('.reel-item').forEach(el => {
      state.reelObserver.observe(el);
      el.querySelector('video').addEventListener('click', (e) => {
        e.stopPropagation();
        const v = e.target;
        if (v.paused) v.play(); else v.pause();
      });
    });
    
    if (startNum) {
      setTimeout(() => {
        const target = document.querySelector(`.reel-item[data-num="${startNum}"]`);
        if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
      }, 100);
    }
    
    let muted = true;
    document.getElementById('soundToggle').addEventListener('click', function() {
      muted = !muted;
      document.querySelectorAll('.reel-item video').forEach(v => v.muted = muted);
      this.textContent = muted ? '🔇' : '🔊';
    });
  },

  course() {
    document.body.classList.remove('reels-mode');
    const html = state.loading.videos ? loadingBox() : state.videos.length === 0 ? emptyBox(t('course.empty')) : state.videos.map(courseCard).join('');
    app.innerHTML = `
      <header style="padding:calc(var(--header-h) + 2rem) 0 2rem;text-align:center;background:var(--primary-light)">
        <div class="container"><h1 style="font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:.5rem">${t('sec.course')}</h1><p style="color:var(--muted)">${t('sec.course.sub')}</p></div>
      </header>
      <section class="section"><div class="container"><div class="grid-3">${html}</div></div></section>
    `;
  },

  about() {
    document.body.classList.remove('reels-mode');
    app.innerHTML = `
      <header style="padding:calc(var(--header-h) + 2rem) 0 2rem;text-align:center;background:var(--primary-light)">
        <div class="container"><h1 style="font-size:clamp(1.8rem,4vw,2.5rem)">${t('about.title')}</h1></div>
      </header>
      <section class="section">
        <div class="container" style="max-width:800px;text-align:center">
          <p style="font-size:1.05rem;color:var(--muted);line-height:1.9;margin-bottom:3rem">${t('about.body')}</p>
          <div style="background:var(--surface);padding:2rem;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm)">
            <h3 style="color:var(--primary)">${t('about.founder')}</h3>
            <p style="color:var(--muted);margin-top:.5rem">${t('about.founderRole')}</p>
          </div>
        </div>
      </section>
    `;
  },

  contact() {
    document.body.classList.remove('reels-mode');
    app.innerHTML = `
      <header style="padding:calc(var(--header-h) + 2rem) 0 2rem;text-align:center;background:var(--primary-light)">
        <div class="container"><h1 style="font-size:clamp(1.8rem,4vw,2.5rem)">${t('contact.title')}</h1></div>
      </header>
      <section class="section">
        <div class="container" style="max-width:500px;text-align:center">
          <div style="display:flex;flex-direction:column;gap:1rem">
            <a href="mailto:Dailyfashion@gmail.com" class="btn btn-outline">${t('contact.email')}: Dailyfashion@gmail.com</a>
            <a href="https://wa.me/93796791538" class="btn btn-outline">${t('contact.wa')}: 0796791538</a>
            <a href="https://whatsapp.com/channel/0029VbDukxNIXnllve5j9p18" class="btn btn-primary">${t('contact.channel')}</a>
          </div>
        </div>
      </section>
    `;
  },

  admin() {
    document.body.classList.remove('reels-mode');
    const isAuth = sessionStorage.getItem('df-admin-auth') === 'true';
    if (!isAuth) {
      app.innerHTML = `
        <div class="admin-wrap">
          <div class="admin-card">
            <h2>${t('admin.title')}</h2>
            <div class="form-group"><input type="password" id="adminPass" class="form-input" placeholder="${t('admin.pass')}"></div>
            <button class="btn btn-primary btn-block" onclick="loginAdmin()">${t('admin.login')}</button>
          </div>
        </div>`;
    } else {
      app.innerHTML = `
        <div class="admin-wrap">
          <div class="admin-card">
            <h2>${t('admin.title')}</h2>
            <div class="tabs">
              <button class="tab-btn active" onclick="switchTab('course')">${t('admin.tab.course')}</button>
              <button class="tab-btn" onclick="switchTab('reels')">${t('admin.tab.reels')}</button>
              <button class="tab-btn" onclick="switchTab('posts')">${t('admin.tab.posts')}</button>
            </div>
            
            <div class="tab-panel active" id="panel-course">
              <div class="form-group"><label>${t('admin.num')}</label><input type="number" id="courseNum" class="form-input" placeholder="1" min="1" max="45"></div>
              <div class="form-group"><label>${t('admin.file')}</label><input type="file" id="courseFile" class="form-input" accept="video/*" style="padding-top:.5rem"></div>
              <button class="btn btn-primary btn-block" id="courseBtn" onclick="uploadCourse()">${t('admin.upload')}</button>
              <div class="admin-status" id="courseStatus"></div>
            </div>
            
            <div class="tab-panel" id="panel-reels">
              <div class="form-group"><label>${t('admin.num')}</label><input type="number" id="reelNum" class="form-input" placeholder="1" min="1" max="999"></div>
              <div class="form-group"><label>${t('admin.file')}</label><input type="file" id="reelFile" class="form-input" accept="video/*" style="padding-top:.5rem"></div>
              <button class="btn btn-primary btn-block" id="reelBtn" onclick="uploadReel()">${t('admin.upload')}</button>
              <div class="admin-status" id="reelStatus"></div>
            </div>
            
            <div class="tab-panel" id="panel-posts">
              <div class="form-group"><label>${t('admin.post.title_fa')}</label><input type="text" id="postTitleFa" class="form-input"></div>
              <div class="form-group"><label>${t('admin.post.title_en')}</label><input type="text" id="postTitleEn" class="form-input"></div>
              <div class="form-group"><label>${t('admin.post.desc_fa')}</label><textarea id="postDescFa" class="form-textarea"></textarea></div>
              <div class="form-group"><label>${t('admin.post.desc_en')}</label><textarea id="postDescEn" class="form-textarea"></textarea></div>
              <div class="form-group"><label>${t('admin.post.img')}</label><input type="url" id="postImg" class="form-input" placeholder="https://..."></div>
              <button class="btn btn-primary btn-block" id="postBtn" onclick="uploadPost()">${t('admin.post.save')}</button>
              <div class="admin-status" id="postStatus"></div>
            </div>
            
            <button class="btn btn-outline btn-block" style="margin-top:1.5rem" onclick="logoutAdmin()">${t('admin.logout')}</button>
          </div>
        </div>`;
    }
  }
};

/* ═══════════════════════════════════════════════════════════════
   §11 REEL HANDLERS
   ═══════════════════════════════════════════════════════════════ */
window.handleLike = function(num, btn) {
  const result = toggleLike(num);
  btn.querySelector('.icon').textContent = result.liked ? '❤️' : '🤍';
  btn.querySelector('.count').textContent = result.count;
  btn.classList.toggle('liked', result.liked);
};

window.handleShare = function(num) {
  const reel = state.reels.find(r => r.num === num);
  if (reel) shareReel(reel);
};

/* ═══════════════════════════════════════════════════════════════
   §12 ADMIN LOGIC
   ═══════════════════════════════════════════════════════════════ */
window.loginAdmin = function() {
  const pass = document.getElementById('adminPass').value;
  if (pass === CONFIG.ADMIN_PASS) { sessionStorage.setItem('df-admin-auth', 'true'); pages.admin(); }
  else alert(t('toast.wrongPass'));
};
window.logoutAdmin = function() { sessionStorage.removeItem('df-admin-auth'); pages.admin(); };
window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', ['course','reels','posts'][i] === tab));
  document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', ['course','reels','posts'][i] === tab));
};

window.uploadCourse = async function() {
  const num = document.getElementById('courseNum').value;
  const file = document.getElementById('courseFile').files[0];
  const btn = document.getElementById('courseBtn');
  const status = document.getElementById('courseStatus');
  if (!num || !file) return alert(t('toast.fill'));
  btn.disabled = true; status.textContent = t('toast.loading'); status.style.color = 'var(--primary)';
  try {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
      const b64 = reader.result.split(',')[1];
      await ghPutFile(`${CONFIG.FOLDERS.course}/${num}.mp4`, b64, CONFIG.GH_TOKEN, `Upload course ${num}`);
      status.textContent = t('toast.uploaded'); status.style.color = 'green';
      await loadAll();
    };
  } catch(e) { status.textContent = '❌ ' + e.message; status.style.color = 'red'; btn.disabled = false; }
};

window.uploadReel = async function() {
  const num = document.getElementById('reelNum').value;
  const file = document.getElementById('reelFile').files[0];
  const btn = document.getElementById('reelBtn');
  const status = document.getElementById('reelStatus');
  if (!num || !file) return alert(t('toast.fill'));
  btn.disabled = true; status.textContent = t('toast.loading'); status.style.color = 'var(--primary)';
  try {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
      const b64 = reader.result.split(',')[1];
      await ghPutFile(`${CONFIG.FOLDERS.reels}/${num}.mp4`, b64, CONFIG.GH_TOKEN, `Upload reel ${num}`);
      status.textContent = t('toast.uploaded'); status.style.color = 'green';
      await loadAll();
    };
  } catch(e) { status.textContent = '❌ ' + e.message; status.style.color = 'red'; btn.disabled = false; }
};

window.uploadPost = async function() {
  const titleFa = document.getElementById('postTitleFa').value;
  const titleEn = document.getElementById('postTitleEn').value;
  const descFa = document.getElementById('postDescFa').value;
  const descEn = document.getElementById('postDescEn').value;
  const img = document.getElementById('postImg').value;
  const btn = document.getElementById('postBtn');
  const status = document.getElementById('postStatus');
  if (!titleFa || !titleEn) return alert(t('toast.fill'));
  btn.disabled = true; status.textContent = t('toast.loading'); status.style.color = 'var(--primary)';
  try {
    const currentPosts = await fetchPosts();
    const newPost = { id: Date.now(), title_fa: titleFa, title_en: titleEn, desc_fa: descFa, desc_en: descEn, image_url: img };
    currentPosts.unshift(newPost);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentPosts, null, 2))));
    await ghPutFile(CONFIG.POSTS_FILE, content, CONFIG.GH_TOKEN, `Add post: ${titleEn}`);
    status.textContent = t('toast.uploaded'); status.style.color = 'green';
    ['postTitleFa','postTitleEn','postDescFa','postDescEn','postImg'].forEach(id => document.getElementById(id).value = '');
    await loadAll();
  } catch(e) { status.textContent = '❌ ' + e.message; status.style.color = 'red'; btn.disabled = false; }
};

/* ═══════════════════════════════════════════════════════════════
   §13 ROUTER & INIT
   ═══════════════════════════════════════════════════════════════ */
function router() {
  const hash = window.location.hash.replace('#/', '') || 'home';
  const route = hash.split('/')[0];
  state.route = route;
  document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === route));
  
  if (route === 'reels') pages.reels();
  else if (route === 'course') pages.course();
  else if (route === 'about') pages.about();
  else if (route === 'contact') pages.contact();
  else if (route === 'admin') pages.admin();
  else pages.home();
  
  if (route !== 'reels') window.scrollTo(0, 0);
}

document.querySelectorAll('.lang-switch button').forEach(btn => btn.addEventListener('click', () => {
  state.lang = btn.dataset.lang; updateLanguage(); router();
}));
window.addEventListener('hashchange', router);

(async function init() {
  initTheme();
  updateLanguage();
  await loadAll();
})();
</script>
