<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D46986">
<title>Daily Fashion AF</title>

<!-- ═══════════════════ PWA ═══════════════════ -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Fashion">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Daily Fashion AF">
<meta name="description" content="آموزش رایگان آرایش، زیبایی و فشن برای همه">
<link rel="apple-touch-icon" href="image/icon-192.png">

<!-- ═══════════════════ FONTS + ICON ═══════════════════ -->
<link rel="icon" href="image/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
(function(){
  document.documentElement.setAttribute('data-theme', localStorage.getItem('df-theme') || 'light');
  var l = localStorage.getItem('df-lang') || 'fa';
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
})();
</script>
<style>
:root{
  --primary:#D46986; --primary-dark:#A9425D; --primary-light:#FDF2F5;
  --bg:#FCFBF9; --surface:#FFFFFF; --text:#2B282C; --muted:#7A757B;
  --border:#F0E6E9; --shadow-sm:0 4px 12px rgba(212,105,134,.06);
  --shadow-lg:0 24px 48px -12px rgba(212,105,134,.18);
  --radius:24px; --radius-sm:14px; --header-h:72px; --nav-h:70px;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#141416; --surface:#1E1E22; --text:#F5F5F5; --muted:#A0A0A5;
  --border:#2D2B30; --primary-light:#2A1B20;
  --shadow-sm:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;transition:background-color .4s var(--ease),color .4s var(--ease);padding-bottom:var(--nav-h);padding-top:env(safe-area-inset-top)}
@media(min-width:900px){body{padding-bottom:0}}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-weight:800;line-height:1.3}
[lang="en"] h1,[lang="en"] h2,[lang="en"] h3,[lang="en"] .brand-name{font-family:'Playfair Display',serif}
.container{width:min(100% - 2rem,1200px);margin-inline:auto}

/* ═══ PWA INSTALL BANNER ═══ */
.install-banner{
  position:fixed;
  bottom:calc(var(--nav-h) + 12px);
  left:12px;right:12px;
  z-index:120;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:1rem 1.2rem;
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  display:none;
  align-items:center;
  gap:1rem;
  animation:slideUp .4s ease;
}
@media(min-width:900px){.install-banner{bottom:20px;left:20px;right:auto;max-width:400px}}
.install-banner.show{display:flex}
.install-banner .ico{font-size:1.8rem;line-height:1}
.install-banner .txt{flex:1;font-size:.88rem;line-height:1.5}
.install-banner .txt strong{display:block;font-size:.98rem;margin-bottom:.15rem}
.install-banner .txt small{opacity:.9;font-size:.78rem}
.install-banner .actions{display:flex;gap:.4rem;flex-shrink:0}
.install-banner button{
  padding:.5rem .9rem;
  border-radius:999px;
  font-size:.82rem;
  font-weight:700;
  white-space:nowrap;
  transition:all .2s;
}
.install-banner .btn-yes{background:#fff;color:var(--primary)}
.install-banner .btn-no{background:rgba(255,255,255,.15);color:#fff}
.install-banner button:active{transform:scale(.95)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ═══ Update toast ═══ */
.update-toast{
  position:fixed;
  bottom:calc(var(--nav-h) + 12px);
  left:50%;transform:translateX(-50%);
  z-index:130;
  background:#2B282C;color:#fff;
  padding:.9rem 1.3rem;
  border-radius:999px;
  font-size:.85rem;font-weight:600;
  box-shadow:var(--shadow-lg);
  display:none;
  align-items:center;gap:.7rem;
}
.update-toast.show{display:flex;animation:slideUp .4s ease}
.update-toast button{background:var(--primary);color:#fff;padding:.35rem .9rem;border-radius:999px;font-size:.8rem;font-weight:700}

.site-header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-h);background:rgba(252,251,249,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
[data-theme="dark"] .site-header{background:rgba(20,20,22,.9)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.brand{display:flex;align-items:center;gap:.75rem}
.logo-holder{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);box-shadow:var(--shadow-sm)}
.logo-holder img{width:100%;height:100%;object-fit:cover}
.brand-name{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.brand-name em{font-style:normal;color:var(--primary)}
.desktop-nav{display:none;gap:.5rem;background:var(--surface);padding:.35rem;border-radius:999px;border:1px solid var(--border)}
@media(min-width:900px){.desktop-nav{display:flex}}
.desktop-nav a{padding:.6rem 1.2rem;border-radius:999px;font-size:.9rem;font-weight:600;color:var(--muted);transition:all .3s}
.desktop-nav a:hover,.desktop-nav a.active{background:var(--primary-light);color:var(--primary)}
.nav-actions{display:flex;align-items:center;gap:.5rem}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text);transition:all .3s}
.icon-btn:hover{background:var(--primary-light);color:var(--primary)}
.icon-btn svg{width:20px;height:20px}
.lang-switch{display:flex;background:var(--surface);border-radius:999px;padding:.25rem;border:1px solid var(--border)}
.lang-switch button{padding:.3rem .8rem;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--muted);transition:.3s}
.lang-switch button.active{background:var(--primary);color:#fff}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
[data-theme="dark"] .bottom-nav{background:rgba(30,30,34,.95)}
@media(min-width:900px){.bottom-nav{display:none}}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;color:var(--muted);font-size:.68rem;font-weight:600;transition:all .3s;flex:1;height:100%;position:relative}
.bottom-nav a .icon-box{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.bottom-nav a svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav a.active::before{content:'';position:absolute;top:0;width:30%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem 1.8rem;border-radius:999px;font-weight:700;font-size:.95rem;transition:all .3s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
.btn-sm{padding:.55rem 1rem;font-size:.82rem}
.btn-block{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.btn-danger{background:#e74c3c;color:#fff;border:none;}
.btn-danger:hover{background:#c0392b;}

.section{padding:4rem 0}
.section-alt{background:var(--primary-light)}
.section-header{text-align:center;margin-bottom:2.5rem}
.section-header h2{font-size:clamp(1.7rem,4vw,2.3rem);margin-bottom:.5rem}
.section-header p{color:var(--muted);font-size:1rem}
.page-head{padding:calc(var(--header-h) + 3rem) 0 1rem;text-align:center}
.page-head h1{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.4rem}
.page-head p{color:var(--muted)}

.hero{position:relative;padding-top:calc(var(--header-h) + 4rem);padding-bottom:5rem;text-align:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1920&q=80') center/cover;opacity:.08;z-index:-1}
.hero-badge{display:inline-flex;padding:.4rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:1.5rem;box-shadow:var(--shadow-sm)}
.hero h1{font-size:clamp(2rem,5.5vw,3.8rem);margin-bottom:1.2rem;line-height:1.2}
.hero p{font-size:clamp(1rem,2vw,1.1rem);color:var(--muted);margin-bottom:2.5rem;max-width:600px;margin-inline:auto}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:all .4s var(--ease);display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}

.product-img{aspect-ratio:1;background-size:cover;background-position:center;position:relative}
.product-info{padding:1.1rem}
.product-info h3{font-size:1rem;margin-bottom:.25rem}
.product-info .brand-name-small{color:var(--muted);font-size:.82rem}
.badge-new{position:absolute;top:.8rem;right:.8rem;background:var(--primary);color:#fff;padding:.2rem .6rem;border-radius:999px;font-size:.68rem;font-weight:800}
[dir="rtl"] .badge-new{right:auto;left:.8rem}

.life-img{aspect-ratio:4/3;background-size:cover;background-position:center}
.life-info{padding:1.1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.life-info h3{font-size:1.02rem}
.life-info p{color:var(--muted);font-size:.83rem;flex:1;line-height:1.7}
.life-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
.life-tag{background:var(--primary-light);color:var(--primary);font-size:.68rem;font-weight:700;padding:.15rem .55rem;border-radius:999px}

/* ═══ Magazine Style Post Cards (Glass Bar) ═══ */
.post-card {
  position: relative;
  cursor: pointer;
}
.post-img{aspect-ratio:16/10;background-size:cover;background-position:center}
.post-info{padding:1.1rem;padding-bottom:3.5rem; /* Space for glass bar */ position:relative;}
.post-info h3{font-size:1.05rem; margin-bottom:0.5rem; line-height: 1.5;}
.post-text-container {
  position: relative;
  max-height: 100px; /* Adjust height to show ~4-5 lines */
  overflow: hidden;
}
.post-text-container p {
  color: var(--muted);
  font-size: 0.85rem;
  text-align: justify;
  line-height: 1.8;
  margin-bottom: 0;
}
/* Fade out effect */
.post-text-container::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(to bottom, transparent, var(--surface));
  pointer-events: none;
}
/* The Glass Bar */
.post-glass-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0.8rem 1.1rem;
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid rgba(212, 105, 134, 0.15);
  display: flex; justify-content: center; align-items: center;
  color: var(--primary); font-weight: 800; font-size: 0.85rem;
  border-radius: 0 0 var(--radius) var(--radius);
  transition: background 0.3s;
}
[data-theme="dark"] .post-glass-bar {
  background: rgba(30, 30, 34, 0.65);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
[data-theme="dark"] .post-text-container::after {
  background: linear-gradient(to bottom, transparent, var(--surface));
}
.post-card:hover .post-glass-bar {
  background: rgba(253, 242, 245, 0.9);
}
[data-theme="dark"] .post-card:hover .post-glass-bar {
  background: rgba(42, 27, 32, 0.9);
}

/* ═══ Post Detail Modal (Magazine Style) ═══ */
.post-modal-box {
  max-width: 800px !important;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  padding: 0 !important;
  border-radius: var(--radius) !important;
  background: var(--surface);
  overflow: hidden; /* جلوگیری از اسکرول کل کادر */
}
.post-modal-img {
  width: 100%;
  height: 350px;
  object-fit: cover;
  flex-shrink: 0;
  border-radius: 24px 24px 0 0;
}
.post-modal-body {
  padding: 2rem;
  overflow-y: auto; /* اسکرول فقط برای متن */
  -webkit-overflow-scrolling: touch; /* اسکرول نرم در iOS */
}
.post-modal-body::-webkit-scrollbar { display: none; }
.post-modal-title {
  font-size: 1.8rem;
  color: var(--text);
  margin-bottom: 1.5rem;
  line-height: 1.4;
  border-bottom: 2px solid var(--primary-light);
  padding-bottom: 1rem;
}
.post-modal-text {
  font-size: 1.05rem;
  line-height: 2.2;
  color: var(--text);
  text-align: justify;
  white-space: pre-wrap;
  word-break: break-word;
}
[data-theme="dark"] .post-modal-text { color: #E0E0E0; }

.course-thumb{aspect-ratio:16/9;position:relative;background:#000;overflow:hidden}
.course-thumb video{width:100%;height:100%;object-fit:cover;opacity:.85}
.course-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--primary);display:grid;place-items:center}
.course-num{position:absolute;top:.8rem;right:.8rem;background:var(--primary);color:#fff;padding:.2rem .6rem;border-radius:999px;font-size:.68rem;font-weight:800}
[dir="rtl"] .course-num{right:auto;left:.8rem}
.course-actions{display:flex;gap:.4rem;margin-top:.7rem}
.course-actions .btn{flex:1}

body.reels-mode{overflow:hidden;padding-bottom:0;padding-top:0}
body.reels-mode .site-header,body.reels-mode .bottom-nav,body.reels-mode .site-footer,body.reels-mode .install-banner{display:none!important}
.reels-page{position:fixed;inset:0;z-index:150;background:#000;overflow:hidden}
.reels-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:1rem 1.2rem;padding-top:calc(1rem + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);color:#fff}
.reels-top button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.reels-title{font-size:1.1rem;font-weight:800}
.reels-feed{width:100%;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels-feed::-webkit-scrollbar{display:none}
.reel-item{width:100%;height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.reel-item video{width:100%;height:100%;object-fit:cover}
.reel-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 45%,transparent 75%,rgba(0,0,0,.3) 100%);pointer-events:none}
.reel-side-actions{position:absolute;right:.8rem;bottom:calc(5.5rem + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:1.3rem;align-items:center}
[dir="rtl"] .reel-side-actions{right:auto;left:.8rem}
.reel-action{display:flex;flex-direction:column;align-items:center;gap:.25rem;color:#fff;font-size:.68rem;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.6);transition:transform .3s}
.reel-action:active{transform:scale(.9)}
.reel-action .icon{font-size:1.9rem;line-height:1;transition:color .3s}
.reel-action.liked .icon{color:#ff2d55}
.reel-info{position:absolute;left:1rem;right:5rem;bottom:calc(1.5rem + env(safe-area-inset-bottom));z-index:5;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}
[dir="rtl"] .reel-info{left:5rem;right:1rem}
.reel-info h3{font-size:1rem;margin-bottom:.3rem;font-weight:800}
.reel-info p{font-size:.82rem;opacity:.92}

.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px)}
.modal-box{position:relative;background:var(--surface);border-radius:var(--radius);width:100%;max-width:520px;overflow:hidden;box-shadow:var(--shadow-lg);z-index:1}
.modal-close{position:absolute;top:1rem;right:1rem;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.modal-video{aspect-ratio:16/9;background:#000}
.modal-video video{width:100%;height:100%;object-fit:contain}
.modal-info{padding:1.5rem}
.modal-info h3{font-size:1.3rem;margin-bottom:.5rem}
.modal-info p{color:var(--muted);font-size:.95rem;margin-bottom:1.3rem}
.modal-actions{display:flex;gap:.5rem}
.modal-actions .btn{flex:1}

.admin-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:calc(var(--header-h) + 2rem) 1rem 2rem}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;width:100%;max-width:520px;box-shadow:var(--shadow-lg)}
.admin-card h2{text-align:center;color:var(--primary);margin-bottom:1.5rem}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:.88rem;font-weight:700;margin-bottom:.4rem}
.form-input,.form-textarea{width:100%;padding:.85rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.95rem;transition:border-color .3s}
.form-input.ltr{direction:ltr;text-align:left}
.form-textarea{min-height:120px;resize:vertical;line-height:1.8}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.checkbox-row{display:flex;align-items:center;gap:.5rem;font-size:.88rem;margin-bottom:1rem;cursor:pointer;user-select:none}
.hint{font-size:.78rem;color:var(--muted);margin-top:.3rem;line-height:1.6}
.admin-status{text-align:center;font-size:.85rem;margin-top:.8rem;font-weight:600;min-height:1.4rem}
.tabs{display:flex;gap:.3rem;margin-bottom:1.3rem;background:var(--bg);padding:.3rem;border-radius:var(--radius-sm)}
.tab-btn{flex:1;padding:.65rem .3rem;text-align:center;font-weight:700;font-size:.82rem;border-radius:8px;color:var(--muted);transition:all .3s}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.test-btn{background:var(--primary-light);color:var(--primary);border:1px solid var(--border);padding:.5rem 1rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-bottom:1rem;width:100%}

.toast{position:fixed;bottom:calc(var(--nav-h) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:#2B282C;color:#fff;padding:.75rem 1.4rem;border-radius:999px;font-size:.88rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:all .3s;z-index:300;max-width:calc(100vw - 2rem);text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.success{background:#1eb955}
.toast.error{background:#e74c3c}

.site-footer{background:var(--surface);border-top:1px solid var(--border);padding:3rem 0 1.5rem;margin-top:3rem;text-align:center}
.footer-content{display:flex;flex-direction:column;align-items:center;gap:1rem}
.footer-content p{color:var(--muted);font-size:.9rem}
.social-links{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
.social-links a{color:var(--primary);font-weight:700;font-size:.9rem}

.empty-box{text-align:center;padding:3rem;background:var(--surface);border-radius:var(--radius);grid-column:1/-1}
.empty-box h3{color:var(--muted);font-weight:600}

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);

  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToUtf8(b64){

  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════ §8 GITHUB API ═══════════════════ */
async function fetchFolder(folder, sortDesc = false) {
  const token = getToken();
  const headers = token ? { Authorization: `Bearer ${token}` } : {};
  try {
    const res = await fetch(
      `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${folder}?t=${Date.now()}`,
      { headers }
    );
    if (res.status === 404) return [];
    if (!res.ok) throw new Error('GitHub API: ' + res.status);
    const files = await res.json();
    if (!Array.isArray(files)) return [];
    const items = files
      .filter(f => f.type === 'file' && /\.(mp4|webm|mov)$/i.test(f.name))
      .map(f => ({ name: f.name, url: f.download_url, sha: f.sha }));

    if (sortDesc) {
      items.sort((a, b) => b.name.localeCompare(a.name));
    } else {
      items.sort((a, b) => {
        const na = parseInt(a.name, 10), nb = parseInt(b.name, 10);
        if (isNaN(na) && isNaN(nb)) return a.name.localeCompare(b.name);
        if (isNaN(na)) return 1;
        if (isNaN(nb)) return -1;
        return na - nb;
      });
    }
    return items;
  } catch (e) {
    console.warn('fetchFolder error:', e);
    return [];
  }
}

async function fetchPosts() {
  const token = getToken();
  const headers = token ? { Authorization: `Bearer ${token}` } : {};
  try {
    // استفاده از API به جای لینک Raw برای جلوگیری از مشکل کش گیت‌هاب
    const res = await fetch(
      `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${CONFIG.POSTS_FILE}?t=${Date.now()}`,
      { headers }
    );
    if (res.status === 404) return [];
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const meta = await res.json();
    const data = JSON.parse(base64ToUtf8(meta.content));
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.warn('fetchPosts API error, falling back to raw:', e);
    try {
      const res = await fetch(
        `https://raw.githubusercontent.com/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/${CONFIG.BRANCH}/${CONFIG.POSTS_FILE}?t=${Date.now()}`
      );
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    } catch(e2) {
      return null;
    }
  }
}

async function loadPostsForWrite() {
  const token = getToken();
  if (!token) throw new Error('توکن تنظیم نشده است');
  const res = await fetch(
    `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${CONFIG.POSTS_FILE}?t=${Date.now()}`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (res.status === 404) return { posts: [], sha: null };
  if (res.status === 401) throw new Error(t('toast.tokenExpired'));
  if (!res.ok) throw new Error('خواندن پست‌ها: HTTP ' + res.status);
  const meta = await res.json();
  let posts = [];
  try {
    posts = JSON.parse(base64ToUtf8(meta.content));
    if (!Array.isArray(posts)) posts = [];
  } catch { posts = []; }
  return { posts, sha: meta.sha };
}

async function ghPutFile(path, base64Content, message, knownSha) {
  const token = getToken();
  if (!token) throw new Error('توکن تنظیم نشده است');

  let sha = knownSha;
  if (sha === undefined) {
    try {
      const r = await fetch(
        `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}?t=${Date.now()}`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      if (r.ok) { const d = await r.json(); sha = d.sha; } else sha = null;
    } catch { sha = null; }
  }

  const res = await fetch(
    `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${path}`,
    {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({ message, content: base64Content, sha: sha || undefined })
    }
  );

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err.message || ('HTTP ' + res.status);
    if (res.status === 401) throw new Error(t('toast.tokenExpired'));
    if (res.status === 403) throw new Error('دسترسی ندارید یا محدودیت نرخ API — چند دقیقه بعد تلاش کنید.');
    if (res.status === 404) throw new Error('مخزن یا مسیر پیدا نشد.');
    if (res.status === 422) throw new Error('فایل خیلی بزرگ است یا محتوا نامعتبر.');
    throw new Error(msg);
  }
  return res.json();
}

/* ═══════════════════ §9 DOWNLOAD / SHARE / LIKE ═══════════════════ */
function getLikedState(id) {
  const likes = JSON.parse(localStorage.getItem('df-liked') || '{}');
  return !!likes[id];
}
function setLikedState(id, liked) {
  const likes = JSON.parse(localStorage.getItem('df-liked') || '{}');
  if (liked) likes[id] = true; else delete likes[id];
  localStorage.setItem('df-liked', JSON.stringify(likes));
}
function getLikeCount(id) {
  const counts = JSON.parse(localStorage.getItem('df-like-counts') || '{}');
  return counts[id] || 0;
}
function setLikeCount(id, count) {
  const counts = JSON.parse(localStorage.getItem('df-like-counts') || '{}');
  counts[id] = Math.max(0, count);
  localStorage.setItem('df-like-counts', JSON.stringify(counts));
}
function toggleLike(id) {
  const wasLiked = getLikedState(id);
  let count = getLikeCount(id);
  if (wasLiked) { count = Math.max(0, count - 1); setLikedState(id, false); }
  else { count += 1; setLikedState(id, true); }
  setLikeCount(id, count);
  return { liked: !wasLiked, count };
}

async function downloadVideo(url, filename) {
  if (!url) { showToast(t('toast.error'), 'error'); return; }
  filename = filename || 'video.mp4';
  if (!/\.[a-z0-9]{2,5}$/i.test(filename)) filename += '.mp4';

  showToast(t('toast.loading'));
  try {
    const res = await fetch(url, { mode: 'cors', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(blobUrl); }, 2000);
    showToast(t('toast.downloaded'));
    return;
  } catch (e) {
    console.warn('Blob download failed, fallback:', e);
  }
  try {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast(t('toast.downloadFail'));
  } catch {
    showToast(t('toast.error'), 'error');
    window.open(url, '_blank', 'noopener');
  }
}

async function shareContent({ title, text, url }) {
  if (!url) url = window.location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title, text, url });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      showToast(t('toast.copied'));
      return;
    }
    throw new Error('no clipboard');
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (ok) { showToast(t('toast.copied')); return; }
      throw new Error('execCommand failed');
    } catch {
      window.prompt(t('reels.share'), url);
    }
  }
}

/* ═══════════════════ §14 ADMIN LOGIC ═══════════════════ */
window.loginAdmin = async function() {
  const token = (document.getElementById('adminToken').value || '').trim();
  const persist = document.getElementById('saveToken').checked;
  const btn = document.getElementById('loginBtn');

  if (!token) { showToast(t('toast.tokenRequired'), 'error'); return; }

  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = t('toast.loading');

  try {
    const res = await fetch(
      `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    if (!res.ok) {
      showToast(t('toast.tokenInvalid') + ' (HTTP ' + res.status + ')', 'error');
      btn.disabled = false;
      btn.textContent = old;
      return;
    }
    setToken(token, persist);
    sessionStorage.setItem('df-admin-auth', 'true');
    await loadAll();
    pages.admin();
  } catch (e) {
    showToast(t('toast.tokenInvalid') + ': ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = old;
  }
};

window.logoutAdmin = function() {
  sessionStorage.removeItem('df-admin-auth');
  clearToken();
  pages.admin();
};

window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + tab);
  if (panel) panel.classList.add('active');
};

window.testConnection = async function() {
  const token = getToken();
  if (!token) { showToast(t('toast.tokenRequired'), 'error'); return; }
  try {
    const res = await fetch(
      `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    if (res.ok) showToast(t('toast.tokenOk'));
    else showToast(t('toast.tokenFail') + ' (HTTP ' + res.status + ')', 'error');
  } catch (e) {
    showToast(t('toast.tokenFail') + ': ' + e.message, 'error');
  }
};

window.uploadCourse = async function() {
  const num = document.getElementById('courseNum').value;
  const file = document.getElementById('courseFile').files[0];
  const btn = document.getElementById('courseBtn');
  const status = document.getElementById('courseStatus');

  if (!num || !file) { status.textContent = t('toast.fill'); status.style.color = 'red'; return; }
  if (file.size > 25 * 1024 * 1024) { status.textContent = t('toast.tooBig'); status.style.color = 'red'; return; }

  btn.disabled = true;
  status.textContent = t('toast.loading');
  status.style.color = 'var(--primary)';

  try {
    const b64 = await fileToBase64(file);
    const path = `${CONFIG.FOLDERS.course}/${num}.mp4`;
    await ghPutFile(path, b64, `Upload course ${num}`);
    status.textContent = t('toast.uploaded');
    status.style.color = 'green';
    showToast(t('toast.uploaded'));
    document.getElementById('courseNum').value = '';
    document.getElementById('courseFile').value = '';
    state.videos = await fetchFolder(CONFIG.FOLDERS.course, false);
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.style.color = 'red';
  } finally {
    btn.disabled = false;
  }
};

window.uploadPost = async function() {
  const titleFa = document.getElementById('postTitleFa').value.trim();
  const titleEn = document.getElementById('postTitleEn').value.trim();
  const descFa = document.getElementById('postDescFa').value.trim();
  const descEn = document.getElementById('postDescEn').value.trim();
  const imgFile = document.getElementById('postImgFile').files[0];
  const btn = document.getElementById('postBtn');
  const status = document.getElementById('postStatus');

  if (!titleFa || !titleEn) { status.textContent = t('toast.fill'); status.style.color = 'red'; return; }

  btn.disabled = true;

  try {
    let finalImageUrl = '';

    if (!imgFile) {
        status.textContent = '❌ لطفاً یک عکس برای پست انتخاب کنید.';
        status.style.color = 'red';
        btn.disabled = false;
        return;
    }

    if (imgFile.size > 15 * 1024 * 1024) {
      status.textContent = t('toast.imageTooBig');
      status.style.color = 'red';
      btn.disabled = false;
      return;
    }
    if (!imgFile.type.startsWith('image/')) {
      status.textContent = t('toast.imageInvalid');
      status.style.color = 'red';
      btn.disabled = false;
      return;
    }

    status.textContent = t('toast.imageUploading');
    status.style.color = 'var(--primary)';

    const m = imgFile.name.match(/\.([a-z0-9]+)$/i);
    const ext = m ? m[1].toLowerCase() : 'jpg';
    const fileName = `post-${Date.now()}.${ext}`;
    const imgPath = `${CONFIG.FOLDERS.images}/${fileName}`;
    const imgB64 = await fileToBase64(imgFile);
    const putResp = await ghPutFile(imgPath, imgB64, `Upload post image ${fileName}`);

    finalImageUrl = putResp?.content?.download_url
      || `https://raw.githubusercontent.com/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/${CONFIG.BRANCH}/${imgPath}`;

    showToast(t('toast.imageUploaded'));

    status.textContent = t('toast.loading');
    status.style.color = 'var(--primary)';

    const { posts: currentPosts, sha } = await loadPostsForWrite();
    
    // چک کردن پست تکراری
    const isDuplicate = currentPosts.some(p => p.title_fa === titleFa);
    if (isDuplicate) {
        status.textContent = t('toast.duplicate');
        status.style.color = 'red';
        btn.disabled = false;
        return;
    }

    const newPost = {
      id: Date.now(),
      title_fa: titleFa, title_en: titleEn,
      desc_fa: descFa, desc_en: descEn,
      image_url: finalImageUrl
    };
    currentPosts.unshift(newPost);
    const b64 = utf8ToBase64(JSON.stringify(currentPosts, null, 2));
    await ghPutFile(CONFIG.POSTS_FILE, b64, `Add post: ${titleEn}`, sha);

    status.textContent = t('toast.uploaded');
    status.style.color = 'green';
    showToast(t('toast.uploaded'));

    ['postTitleFa','postTitleEn','postDescFa','postDescEn','postImgFile']
      .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });

    // بارگذاری مجدد دیتا از سرور برای همگام‌سازی کامل
    setTimeout(async () => {
      await loadAll();
      pages.admin();
    }, 1000);

  } catch (e) {
    const msg = e.message.includes('HTTP') || e.message.includes('توکن') || e.message.includes('Token')
      ? e.message
      : t('toast.postsReadFail');
    status.textContent = '❌ ' + msg;
    status.style.color = 'red';
  } finally {
    btn.disabled = false;
  }
};

/* ── حذف پست ── */
window.deletePost = async function(id) {
  if(!confirm('آیا از حذف این پست مطمئن هستید؟ این عمل قابل بازگشت نیست.')) return;
  try {
    const { posts: currentPosts, sha } = await loadPostsForWrite();
    if (!currentPosts) throw new Error('خطا در خواندن اطلاعات');
    
    // تبدیل id به رشته برای مقایسه مطمئن
    const updatedPosts = currentPosts.filter(p => String(p.id) !== String(id));
    
    if (currentPosts.length === updatedPosts.length) {
      showToast('پست در سرور یافت نشد. در حال بروزرسانی...', 'error');
      await loadAll();
      pages.admin();
      return;
    }

    const b64 = utf8ToBase64(JSON.stringify(updatedPosts, null, 2));
    await ghPutFile(CONFIG.POSTS_FILE, b64, `Delete post ID: ${id}`, sha);
    
    showToast(t('toast.deleted'));
    
    // صبر کوتاه برای آپدیت گیت‌هاب و سپس بارگذاری مجدد
    setTimeout(async () => {
      await loadAll();
      pages.admin();
    }, 1000);

  } catch(e) {
    showToast('❌ خطا در حذف پست: ' + e.message, 'error');
  }
};

/* ═══════════════════ §15 PWA LOGIC ═══════════════════ */
let deferredInstallPrompt = null;
let swRegistration = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  setTimeout(() => {
    const dismissed = localStorage.getItem('df-install-dismissed');
    const dismissedAt = dismissed ? parseInt(dismissed, 10) : 0;
    const daysSince = (Date.now() - dismissedAt) / (1000 * 60 * 60 * 24);
    if (!dismissed || daysSince > 7) {
      const banner = document.getElementById('installBanner');
      if (banner && !window.matchMedia('(display-mode: standalone)').matches) {
        banner.classList.add('show');
      }
    }
  }, 3000);
});

window.installApp = async function() {
  if (!deferredInstallPrompt) {
    showToast('نصب در این مرورگر پشتیبانی نمی‌شود', 'error');
    return;
  }
  deferredInstallPrompt.prompt();
  const { outcome } = await deferredInstallPrompt.userChoice;
  if (outcome === 'accepted') {
    showToast(t('pwa.installed'));
  }
  deferredInstallPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
};

window.dismissInstall = function() {
  localStorage.setItem('df-install-dismissed', Date.now().toString());
  document.getElementById('installBanner').classList.remove('show');
};

window.addEventListener('appinstalled', () => {
  showToast(t('pwa.installed'));
  document.getElementById('installBanner').classList.remove('show');
  deferredInstallPrompt = null;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        swRegistration = reg;
        console.log('✅ SW registered:', reg.scope);
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              document.getElementById('updateToast').classList.add('show');
            }
          });
        });
      })
      .catch(err => console.warn('SW registration failed:', err));

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

window.reloadForUpdate = function() {
  if (swRegistration && swRegistration.waiting) {
    swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
  } else {
    window.location.reload();
  }
  document.getElementById('updateToast').classList.remove('show');
};

/* ═══════════════════ §16 ROUTER & INIT ═══════════════════ */
function router() {
  const hash = window.location.hash.replace('#/', '') || 'home';
  const route = hash.split('/')[0];
  state.route = route;
  document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === route));

  if (route === 'reels') pages.reels();
  else if (route === 'course') pages.course();
  else if (route === 'about') pages.about();
  else if (route === 'contact') pages.contact();
  else if (route === 'admin') pages.admin();
  else pages.home();

  if (route !== 'reels') window.scrollTo(0, 0);
}

document.querySelectorAll('.lang-switch button').forEach(btn => btn.addEventListener('click', () => {
  state.lang = btn.dataset.lang;
  updateLanguage();
  router();
}));
window.addEventListener('hashchange', router);

(async function init() {
  initTheme();
  updateLanguage();
  await loadAll();
  router();

  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    document.getElementById('installBanner').classList.remove('show');
  }
})();
</script>
